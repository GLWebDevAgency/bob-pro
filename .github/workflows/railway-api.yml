name: Railway API Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Release path to execute
        required: true
        default: release
        type: choice
        options:
          - release
          - m1b-staging-certification
          - m1b-staging-recovery
          - k2-staging-schema
      environment:
        description: Railway environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      service:
        description: Railway API service name or id
        required: true
        default: bob-pro-api
      founder_authorization_date:
        description: M1-B founder authorization date (YYYY-MM-DD)
        required: false
        default: ''
      founder_authorization_channel:
        description: M1-B founder authorization channel
        required: false
        default: ''
      founder_authorization_ref:
        description: M1-B immutable founder authorization reference
        required: false
        default: ''
      claude_countersign_ref:
        description: M1-B immutable Claude countersignature reference
        required: false
        default: ''
      gpt_countersign_ref:
        description: M1-B immutable GPT countersignature reference
        required: false
        default: ''
  workflow_call:
    inputs:
      purpose:
        description: Release path to execute
        required: false
        default: release
        type: string
      environment:
        description: Railway environment
        required: true
        type: string
      service:
        description: Railway API service name or id
        required: true
        type: string
      founder_authorization_date:
        description: M1-B founder authorization date (YYYY-MM-DD)
        required: false
        default: ''
        type: string
      founder_authorization_channel:
        description: M1-B founder authorization channel
        required: false
        default: ''
        type: string
      founder_authorization_ref:
        description: M1-B immutable founder authorization reference
        required: false
        default: ''
        type: string
      claude_countersign_ref:
        description: M1-B immutable Claude countersignature reference
        required: false
        default: ''
        type: string
      gpt_countersign_ref:
        description: M1-B immutable GPT countersignature reference
        required: false
        default: ''
        type: string
    outputs:
      api_base_url:
        description: HTTPS API origin whose readiness matched the uploaded revision
        value: ${{ jobs.release-api.outputs.api_base_url }}
      release_sha:
        description: Revision certified by the readiness smoke
        value: ${{ jobs.release-api.outputs.release_sha }}
      release_environment:
        description: Railway environment certified by the readiness smoke
        value: ${{ jobs.release-api.outputs.release_environment }}
jobs:
  validate-purpose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject every unknown execution path
        env:
          RELEASE_PURPOSE: ${{ inputs.purpose }}
        run: |
          case "$RELEASE_PURPOSE" in
            release|m1b-staging-certification|m1b-staging-recovery|k2-staging-schema) ;;
            *) echo "Unsupported Railway release purpose" >&2; exit 1 ;;
          esac

  route-m1b-staging-certification:
    needs: validate-purpose
    if: ${{ inputs.purpose == 'm1b-staging-certification' || inputs.purpose == 'm1b-staging-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: staging
    steps:
      - name: Require the dedicated staging target
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_SERVICE: ${{ inputs.service }}
          EXPECTED_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
        run: |
          test "$RELEASE_ENVIRONMENT" = staging
          test -n "$EXPECTED_SERVICE"
          test "$RELEASE_SERVICE" = "$EXPECTED_SERVICE"

  certify-agent-mission-m1b-staging:
    needs: route-m1b-staging-certification
    if: ${{ (inputs.purpose == 'm1b-staging-certification' || inputs.purpose == 'm1b-staging-recovery') && needs.route-m1b-staging-certification.result == 'success' }}
    uses: ./.github/workflows/agent-mission-m1b-staging.yml
    with:
      mode: ${{ inputs.purpose == 'm1b-staging-recovery' && 'recovery' || 'certification' }}
      founder_authorization_date: ${{ inputs.founder_authorization_date }}
      founder_authorization_channel: ${{ inputs.founder_authorization_channel }}
      founder_authorization_ref: ${{ inputs.founder_authorization_ref }}
      claude_countersign_ref: ${{ inputs.claude_countersign_ref }}
      gpt_countersign_ref: ${{ inputs.gpt_countersign_ref }}
    secrets: inherit

  certify-agent-mission-k2-staging-schema:
    needs: validate-purpose
    if: ${{ inputs.purpose == 'k2-staging-schema' && needs.validate-purpose.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: railway-api-staging
      cancel-in-progress: false
    env:
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      BOB_M1B_STAGING_COMPANY_ID: ${{ vars.BOB_M1B_STAGING_COMPANY_ID }}
      BOB_M1B_STAGING_SUPABASE_PROJECT_REF: ${{ vars.BOB_M1B_STAGING_SUPABASE_PROJECT_REF }}
      BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER: ${{ vars.BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER }}
      BOB_M1B_STAGING_DATABASE_OID: ${{ vars.BOB_M1B_STAGING_DATABASE_OID }}
      BOB_M1B_STAGING_DATABASE_NAME: ${{ vars.BOB_M1B_STAGING_DATABASE_NAME }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the exact staging-only target
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_SERVICE: ${{ inputs.service }}
          EXPECTED_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RELEASE_ENVIRONMENT" = staging
          test -n "$EXPECTED_SERVICE"
          test "$RELEASE_SERVICE" = "$EXPECTED_SERVICE"
          node <<'NODE'
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const required = [
            'RAILWAY_PROJECT_ID',
            'RAILWAY_ENVIRONMENT_ID',
            'RAILWAY_API_SERVICE_ID',
            'BOB_M1B_STAGING_COMPANY_ID',
            'BOB_M1B_STAGING_SUPABASE_PROJECT_REF',
            'BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER',
            'BOB_M1B_STAGING_DATABASE_OID',
            'BOB_M1B_STAGING_DATABASE_NAME',
            'RAILWAY_TOKEN',
          ];
          for (const name of required) {
            const value = process.env[name];
            if (
              typeof value !== 'string'
              || value.length < 1
              || value.length > 16_384
              || value !== value.trim()
            ) {
              throw new Error(`${name} is required by the staging environment`);
            }
          }
          for (const name of [
            'RAILWAY_PROJECT_ID',
            'RAILWAY_ENVIRONMENT_ID',
            'RAILWAY_API_SERVICE_ID',
          ]) {
            if (!uuid.test(process.env[name] ?? '')) {
              throw new Error(`${name} must be a UUID`);
            }
          }
          if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA ?? '')) {
            throw new Error('GITHUB_SHA must be exact');
          }
          NODE
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Install the deterministic schema operator
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pnpm install --frozen-lockfile
          sh apps/api/scripts/install-railway-cli.sh
      - name: Prove the staging-only operator and workflow routing
        run: |
          node --test \
            apps/api/scripts/agent-mission-k2-staging-schema.test.mjs \
            apps/api/scripts/agent-mission-m1b-staging-release-safety.test.mjs
      - name: Apply and certify only the K2 schema migration
        timeout-minutes: 8
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              BOB_K2_RELEASE_SHA="$GITHUB_SHA" \
              BOB_M1B_STAGING_COMPANY_ID="$BOB_M1B_STAGING_COMPANY_ID" \
              BOB_M1B_STAGING_SUPABASE_PROJECT_REF="$BOB_M1B_STAGING_SUPABASE_PROJECT_REF" \
              BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER="$BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER" \
              BOB_M1B_STAGING_DATABASE_OID="$BOB_M1B_STAGING_DATABASE_OID" \
              BOB_M1B_STAGING_DATABASE_NAME="$BOB_M1B_STAGING_DATABASE_NAME" \
              GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              node apps/api/scripts/agent-mission-k2-staging-schema.mjs apply
      - name: Require the paired non-PII receipts
        run: |
          EVIDENCE_DIRECTORY=".release-evidence/agent-mission-k2" \
            node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (status) => JSON.parse(fs.readFileSync(
            path.join(
              process.env.EVIDENCE_DIRECTORY,
              `staging-schema-${process.env.GITHUB_SHA}-${status}.json`,
            ),
            'utf8',
          ));
          const preflight = read('preflight');
          const certified = read('certified');
          if (
            preflight?.schema !== 'bob.agent-mission.k2.staging-schema-evidence'
            || certified?.schema !== preflight.schema
            || preflight?.version !== 1
            || certified?.version !== 1
            || preflight?.status !== 'preflight'
            || certified?.status !== 'certified'
            || !['apply', 'recertify'].includes(preflight?.operation)
            || certified?.operation !== preflight.operation
            || preflight?.releaseSha !== process.env.GITHUB_SHA
            || certified?.releaseSha !== process.env.GITHUB_SHA
            || certified?.pendingMigrationCount !== 0
            || (
              preflight.operation === 'apply'
              && (
                preflight?.pendingMigrationCount !== 1
                || certified?.appliedMigrationCount
                  !== preflight?.appliedMigrationCount + 1
              )
            )
            || (
              preflight.operation === 'recertify'
              && (
                preflight?.pendingMigrationCount !== 0
                || certified?.appliedMigrationCount
                  !== preflight?.appliedMigrationCount
              )
            )
            || preflight?.n1WriterOutcome !== 'not-run'
            || !['accepted', 'disabled-fence'].includes(
              certified?.n1WriterOutcome,
            )
            || certified?.migrationChecksum !== preflight.migrationChecksum
            || certified?.databasePinHash !== preflight.databasePinHash
            || certified?.schemaOwner !== preflight.schemaOwner
            || certified?.foreignAuthorityHash !== preflight.foreignAuthorityHash
            || certified?.githubRunId !== preflight.githubRunId
            || certified?.githubRunAttempt !== preflight.githubRunAttempt
            || !Number.isFinite(Date.parse(preflight?.observedAt ?? ''))
            || Date.parse(certified?.observedAt ?? '')
              < Date.parse(preflight.observedAt)
          ) {
            throw new Error('K2 staging receipts are not an exact certified pair');
          }
          NODE
      - name: Preserve the K2 schema receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-mission-k2-staging-schema-${{ github.sha }}
          path: .release-evidence/agent-mission-k2/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  release-api:
    # GitHub cancels a normal run step after roughly ten seconds. Keep the job alive so the
    # cancellation-specific cleanup step below can reconcile an archive deployment whose creation
    # response was lost; all ordinary unfinished steps still retain their implicit success() guard.
    needs: validate-purpose
    if: ${{ always() && needs.validate-purpose.result == 'success' && inputs.purpose == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Map the free-form workflow_call input before GitHub resolves environment
    # secrets. The validation step below still fails closed for unsupported
    # values, while an invalid caller can never select an arbitrary environment.
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    concurrency:
      group: railway-api-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      api_base_url: ${{ steps.readiness.outputs.api_base_url }}
      release_sha: ${{ steps.readiness.outputs.release_sha }}
      release_environment: ${{ steps.readiness.outputs.release_environment }}
    steps:
      - name: Capture the release job time budget
        run: echo "BOB_RELEASE_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate release target
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_SERVICE: ${{ inputs.service }}
          EXPECTED_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
          ARCHIVE_AUDIT_SERVICE_ID: ${{ vars.RAILWAY_ARCHIVE_AUDIT_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_PROMOTION_WORKFLOW_REF: ${{ format('{0}/.github/workflows/cabinet-release.yml@refs/heads/main', github.repository) }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_ENVIRONMENT" in
            staging|production) ;;
            *) echo "Unsupported Railway environment" >&2; exit 1 ;;
          esac
          [ -n "$EXPECTED_SERVICE" ] || { echo "GitHub environment variable RAILWAY_API_SERVICE is required" >&2; exit 1; }
          [ "$RELEASE_SERVICE" = "$EXPECTED_SERVICE" ] || { echo "Railway service does not match the selected environment" >&2; exit 1; }
          ARCHIVE_AUDIT_SERVICE_ID="$ARCHIVE_AUDIT_SERVICE_ID" RAILWAY_ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" node <<'NODE'
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          if (!uuid.test(process.env.ARCHIVE_AUDIT_SERVICE_ID ?? '')) {
            throw new Error('RAILWAY_ARCHIVE_AUDIT_SERVICE_ID must be a UUID');
          }
          if (!uuid.test(process.env.RAILWAY_ENVIRONMENT_ID ?? '')) {
            throw new Error('RAILWAY_ENVIRONMENT_ID must be a UUID');
          }
          NODE
          if [ "$RELEASE_ENVIRONMENT" = production ]; then
            [ "$CALLER_WORKFLOW_REF" = "$EXPECTED_PROMOTION_WORKFLOW_REF" ] || { echo "Production is only callable through cabinet-release.yml on main" >&2; exit 1; }
            [ "$RELEASE_REF" = refs/heads/main ] || { echo "Production requires refs/heads/main" >&2; exit 1; }
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      # Construit @bob/api ET ses dépendances workspace (@bob/core, @bob/ai, …) :
      # les tests résolvent les packages via leur entry dist.
      - run: pnpm --filter "@bob/api..." build
      - run: pnpm --filter @bob/core test:cabinet:coverage
      - run: pnpm --filter @bob/api typecheck
      - run: pnpm --filter @bob/api lint
      - run: pnpm --filter @bob/api test
      - name: Embed the revision that Railway will actually upload
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: node apps/api/scripts/write-release-metadata.mjs "$GITHUB_SHA" "$RELEASE_ENVIRONMENT"
      - run: docker build -f Dockerfile -t bob-pro-api:ci .
      - name: Install pinned Railway CLI
        run: sh apps/api/scripts/install-railway-cli.sh
      - name: Gate process-local throttling to one Railway replica
        timeout-minutes: 2
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          timeout 20s railway status --environment "$TARGET_ENVIRONMENT_NAME" --json \
            | node apps/api/scripts/certify-railway-single-replica.mjs "$TARGET_ENVIRONMENT_NAME" "$RAILWAY_SERVICE"
      # Deux trains obligatoires pour l'archive V2 : aucune migration ne peut empêcher une
      # ancienne réplique de RENVOYER en mémoire un XML B2C. Le prédécesseur doit donc déjà
      # publier le fence HTTP old-schema-compatible, puis être l'unique réplique active.
      - name: Certify predecessor B2C HTTP fence before archive expansion
        id: predecessor_capabilities
        timeout-minutes: 3
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node <<'NODE'
          const url = new URL(process.env.API_BASE_URL ?? '');
          if (url.protocol !== 'https:') throw new Error('API_BASE_URL must use https');
          NODE
          body="$(mktemp)"
          fenced=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 3 --max-time 10 \
              "$API_BASE_URL/health/ready" >"$body"
            then
              if HEALTH_BODY="$body" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.HEALTH_BODY, 'utf8'));
          if (payload?.ready !== true) process.exit(1);
          if (payload?.capabilities?.documentArchiveB2cHttpFence !== 'v1') process.exit(1);
          NODE
              then
                fenced=true
                break
              fi
            fi
            sleep 5
          done
          [ "$fenced" = true ] || {
            echo "Refusing archive migrations: deployed predecessor lacks documentArchiveB2cHttpFence=v1" >&2
            exit 1
          }
          realtime_cancellation_fence=false
          if HEALTH_BODY="$body" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.HEALTH_BODY, 'utf8'));
          if (payload?.capabilities?.realtimeAdmissionCancellationFence !== 'v1') process.exit(1);
          NODE
          then
            realtime_cancellation_fence=true
          fi
          echo "realtime_cancellation_fence=$realtime_cancellation_fence" >> "$GITHUB_OUTPUT"
      # Inputs texte libre passés via env (jamais interpolés dans le shell) — anti-injection.
      - name: Expand schema, spool notification delivery, and certify RLS
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          REALTIME_CANCELLATION_FENCE_PREDECESSOR_CAPABLE: ${{ steps.predecessor_capabilities.outputs.realtime_cancellation_fence }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" \
            env BOB_RELEASE_EXPECTED_ENV="$RELEASE_ENVIRONMENT" \
              sh apps/api/scripts/check-release-env.sh
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" \
            env BOB_RELEASE_PHASE=predeploy \
              BOB_RELEASE_EXPECTED_ENV="$RELEASE_ENVIRONMENT" \
              BOB_RELEASE_SHA="$GITHUB_SHA" \
              BOB_RELEASE_RUN_ID="$GITHUB_RUN_ID" \
              BOB_RELEASE_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              REALTIME_CANCELLATION_FENCE_PREDECESSOR_CAPABLE="$REALTIME_CANCELLATION_FENCE_PREDECESSOR_CAPABLE" \
              sh apps/api/scripts/release.sh
      - name: Deploy API and wait for the new revision
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
        # En CI, le flux attaché ne constitue pas une preuve suffisante de disponibilité.
        # La topologie et la readiness SHA exacte ci-dessous restent les autorités bloquantes.
        run: railway up --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME"
      - name: Re-certify the deployed replica topology
        timeout-minutes: 3
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          certified=false
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --environment "$TARGET_ENVIRONMENT_NAME" --json \
              | node apps/api/scripts/certify-railway-single-replica.mjs "$TARGET_ENVIRONMENT_NAME" "$RAILWAY_SERVICE"
            then
              certified=true
              break
            fi
            sleep 5
          done
          [ "$certified" = true ] || {
            echo "Railway kept more than one active process after the bounded teardown window" >&2
            exit 1
          }
      - name: Smoke API readiness
        id: readiness
        timeout-minutes: 3
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EXPECTED_RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          node <<'NODE'
          const raw = process.env.API_BASE_URL ?? '';
          const url = new URL(raw);
          if (url.protocol !== 'https:') throw new Error('GitHub environment variable API_BASE_URL must use https');
          NODE
          body="$(mktemp)"
          matched=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 3 --max-time 10 \
              "$API_BASE_URL/health/ready" >"$body"
            then
              if HEALTH_BODY="$body" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.HEALTH_BODY, 'utf8'));
          if (payload?.ready !== true) process.exit(1);
          if (payload?.release?.sha !== process.env.EXPECTED_RELEASE_SHA) process.exit(1);
          if (payload?.release?.environment !== process.env.EXPECTED_RELEASE_ENVIRONMENT) process.exit(1);
          if (payload?.capabilities?.realtimeAdmissionCancellationFence !== 'v1') process.exit(1);
          if (payload?.capabilities?.agentMissionBootstrapReceipt !== 'v1') process.exit(1);
          if (payload?.network?.clientIpSource !== 'railway-x-real-ip') process.exit(1);
          NODE
              then
                matched=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$matched" != true ]; then
            echo "The expected Railway revision never became ready" >&2
            exit 1
          fi
          metrics_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 3 --max-time 10 \
              "$API_BASE_URL/metrics"
          )"
          case "$metrics_status" in
            401|403) ;;
            *) echo "Unauthenticated /metrics must be denied, got HTTP $metrics_status" >&2; exit 1 ;;
          esac
          echo "api_base_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "release_sha=$EXPECTED_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_environment=$EXPECTED_RELEASE_ENVIRONMENT" >> "$GITHUB_OUTPUT"
      - name: Reserve the archive audit and cleanup time budget
        if: ${{ success() && !cancelled() }}
        env:
          RELEASE_JOB_STARTED_AT: ${{ env.BOB_RELEASE_JOB_STARTED_AT }}
        run: |
          node <<'NODE'
          const startedAt = Number(process.env.RELEASE_JOB_STARTED_AT);
          const now = Math.floor(Date.now() / 1_000);
          const elapsedSeconds = now - startedAt;
          if (!Number.isSafeInteger(startedAt) || !Number.isSafeInteger(elapsedSeconds) || elapsedSeconds < 0) {
            throw new Error('Release job time budget is invalid');
          }
          if (elapsedSeconds > 10_800) {
            throw new Error('Refusing to start the archive audit without its cleanup time budget');
          }
          NODE
      - name: Preflight and run the isolated Railway archive byte-audit
        id: archive_audit
        if: ${{ success() && !cancelled() }}
        timeout-minutes: 100
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ARCHIVE_AUDIT_SERVICE_ID: ${{ vars.RAILWAY_ARCHIVE_AUDIT_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RELEASE_SHA: ${{ github.sha }}
          DOCUMENT_ARCHIVE_AUDIT_CI_EVIDENCE: ${{ github.workspace }}/.release-evidence/document-archive/audit-${{ github.sha }}.json
          DOCUMENT_ARCHIVE_AUDIT_TIMEOUT_SECONDS: '5400'
          # Railway's public API is quota-bound; the runner rejects any cadence below 10 s.
          DOCUMENT_ARCHIVE_AUDIT_POLL_SECONDS: '10'
        run: node apps/api/scripts/run-railway-document-archive-audit.mjs
      - name: Reconcile the Railway archive audit deployment
        # Railway peut conserver l'instance one-shot RUNNING après un SUCCESS. Le cleanup durable
        # est donc obligatoire pour tout audit démarré, avant toute activation irréversible.
        if: ${{ always() && steps.archive_audit.outcome != 'skipped' }}
        timeout-minutes: 4
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ARCHIVE_AUDIT_SERVICE_ID: ${{ vars.RAILWAY_ARCHIVE_AUDIT_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RELEASE_SHA: ${{ github.sha }}
          DOCUMENT_ARCHIVE_AUDIT_CI_EVIDENCE: ${{ github.workspace }}/.release-evidence/document-archive/audit-${{ github.sha }}.json
          DOCUMENT_ARCHIVE_AUDIT_TIMEOUT_SECONDS: '5400'
          DOCUMENT_ARCHIVE_AUDIT_POLL_SECONDS: '10'
        run: node apps/api/scripts/run-railway-document-archive-audit.mjs --cleanup-only
      - name: Preserve the non-PII archive audit envelope
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: document-archive-${{ inputs.environment }}-${{ github.sha }}
          path: .release-evidence/document-archive/
          if-no-files-found: error
          retention-days: 90
      - name: Activate archive/settlement/outbox v2 and finalize the certified release
        if: ${{ success() && steps.archive_audit.outcome == 'success' }}
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EXPECTED_RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        # Les activations n'interviennent qu'après readiness du SHA et preuve mono-réplique.
        # Avant cette étape, N-1 peut continuer les écritures V1 et les messages restent spoolés.
        # Après activation, tout rollback N-1 est interdit : seule une correction roll-forward est sûre.
        run: |
          certify_exact_revision() {
            probe_phase="$1"
            topology_matched=false
            for attempt in $(seq 1 3); do
              if timeout 20s railway status --environment "$TARGET_ENVIRONMENT_NAME" --json \
                | node apps/api/scripts/certify-railway-single-replica.mjs "$TARGET_ENVIRONMENT_NAME" "$RAILWAY_SERVICE"
              then
                topology_matched=true
                break
              fi
              sleep 5
            done
            [ "$topology_matched" = true ] || {
              echo "Railway topology drifted during $probe_phase" >&2
              return 1
            }

            body="$(mktemp)"
            revision_matched=false
            for attempt in $(seq 1 3); do
              if curl --fail --silent --show-error --location \
                --connect-timeout 3 --max-time 10 \
                "$API_BASE_URL/health/ready" >"$body"
              then
                if HEALTH_BODY="$body" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.HEALTH_BODY, 'utf8'));
          if (payload?.ready !== true) process.exit(1);
          if (payload?.release?.sha !== process.env.EXPECTED_RELEASE_SHA) process.exit(1);
          if (payload?.release?.environment !== process.env.EXPECTED_RELEASE_ENVIRONMENT) process.exit(1);
          if (payload?.capabilities?.realtimeAdmissionCancellationFence !== 'v1') process.exit(1);
          if (payload?.capabilities?.agentMissionBootstrapReceipt !== 'v1') process.exit(1);
          if (payload?.network?.clientIpSource !== 'railway-x-real-ip') process.exit(1);
          NODE
                then
                  revision_matched=true
                  break
                fi
              fi
              sleep 5
            done
            [ "$revision_matched" = true ] || {
              echo "The deployed revision drifted during $probe_phase" >&2
              return 1
            }
          }

          certify_exact_revision before-activation
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" \
            env BOB_RELEASE_EXPECTED_ENV="$TARGET_ENVIRONMENT_NAME" \
              BOB_RELEASE_SHA="$GITHUB_SHA" \
              BOB_RELEASE_RUN_ID="$GITHUB_RUN_ID" \
              BOB_RELEASE_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              sh apps/api/scripts/activate-release-protocols-v2.sh
          certify_exact_revision before-postdeploy
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" \
            env BOB_RELEASE_PHASE=postdeploy \
              BOB_RELEASE_EXPECTED_ENV="$TARGET_ENVIRONMENT_NAME" \
              BOB_RELEASE_SHA="$GITHUB_SHA" \
              BOB_RELEASE_RUN_ID="$GITHUB_RUN_ID" \
              BOB_RELEASE_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              sh apps/api/scripts/release.sh
      - name: Preserve the non-PII release phase receipt
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-release-receipt-${{ inputs.environment }}-${{ github.sha }}
          path: .release-evidence/api/predeploy-receipt.json
          if-no-files-found: warn
          retention-days: 30
