name: Railway API Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Release path to execute
        required: true
        default: release
        type: choice
        options:
          - release
          - m1b-staging-certification
      environment:
        description: Railway environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      service:
        description: Railway API service name or id
        required: true
        default: bob-pro-api
      founder_authorization_date:
        description: M1-B founder authorization date (YYYY-MM-DD)
        required: false
        default: ''
      founder_authorization_channel:
        description: M1-B founder authorization channel
        required: false
        default: ''
      founder_authorization_ref:
        description: M1-B immutable founder authorization reference
        required: false
        default: ''
      claude_countersign_ref:
        description: M1-B immutable Claude countersignature reference
        required: false
        default: ''
      gpt_countersign_ref:
        description: M1-B immutable GPT countersignature reference
        required: false
        default: ''
  workflow_call:
    inputs:
      purpose:
        description: Release path to execute
        required: false
        default: release
        type: string
      environment:
        description: Railway environment
        required: true
        type: string
      service:
        description: Railway API service name or id
        required: true
        type: string
      founder_authorization_date:
        description: M1-B founder authorization date (YYYY-MM-DD)
        required: false
        default: ''
        type: string
      founder_authorization_channel:
        description: M1-B founder authorization channel
        required: false
        default: ''
        type: string
      founder_authorization_ref:
        description: M1-B immutable founder authorization reference
        required: false
        default: ''
        type: string
      claude_countersign_ref:
        description: M1-B immutable Claude countersignature reference
        required: false
        default: ''
        type: string
      gpt_countersign_ref:
        description: M1-B immutable GPT countersignature reference
        required: false
        default: ''
        type: string
    outputs:
      api_base_url:
        description: HTTPS API origin whose readiness matched the uploaded revision
        value: ${{ jobs.release-api.outputs.api_base_url }}
      release_sha:
        description: Revision certified by the readiness smoke
        value: ${{ jobs.release-api.outputs.release_sha }}
      release_environment:
        description: Railway environment certified by the readiness smoke
        value: ${{ jobs.release-api.outputs.release_environment }}
jobs:
  route-m1b-staging-certification:
    if: ${{ inputs.purpose == 'm1b-staging-certification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: staging
    steps:
      - name: Require the dedicated staging target
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_SERVICE: ${{ inputs.service }}
          EXPECTED_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
        run: |
          test "$RELEASE_ENVIRONMENT" = staging
          test -n "$EXPECTED_SERVICE"
          test "$RELEASE_SERVICE" = "$EXPECTED_SERVICE"

  certify-agent-mission-m1b-staging:
    needs: route-m1b-staging-certification
    if: ${{ inputs.purpose == 'm1b-staging-certification' && needs.route-m1b-staging-certification.result == 'success' }}
    uses: ./.github/workflows/agent-mission-m1b-staging.yml
    with:
      founder_authorization_date: ${{ inputs.founder_authorization_date }}
      founder_authorization_channel: ${{ inputs.founder_authorization_channel }}
      founder_authorization_ref: ${{ inputs.founder_authorization_ref }}
      claude_countersign_ref: ${{ inputs.claude_countersign_ref }}
      gpt_countersign_ref: ${{ inputs.gpt_countersign_ref }}
    secrets: inherit

  release-api:
    # GitHub cancels a normal run step after roughly ten seconds. Keep the job alive so the
    # cancellation-specific cleanup step below can reconcile an archive deployment whose creation
    # response was lost; all ordinary unfinished steps still retain their implicit success() guard.
    if: ${{ always() && inputs.purpose != 'm1b-staging-certification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Map the free-form workflow_call input before GitHub resolves environment
    # secrets. The validation step below still fails closed for unsupported
    # values, while an invalid caller can never select an arbitrary environment.
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    concurrency:
      group: railway-api-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      api_base_url: ${{ steps.readiness.outputs.api_base_url }}
      release_sha: ${{ steps.readiness.outputs.release_sha }}
      release_environment: ${{ steps.readiness.outputs.release_environment }}
    steps:
      - name: Capture the release job time budget
        run: echo "BOB_RELEASE_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate release target
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_SERVICE: ${{ inputs.service }}
          EXPECTED_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
          ARCHIVE_AUDIT_SERVICE_ID: ${{ vars.RAILWAY_ARCHIVE_AUDIT_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_PROMOTION_WORKFLOW_REF: ${{ format('{0}/.github/workflows/cabinet-release.yml@refs/heads/main', github.repository) }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_ENVIRONMENT" in
            staging|production) ;;
            *) echo "Unsupported Railway environment" >&2; exit 1 ;;
          esac
          [ -n "$EXPECTED_SERVICE" ] || { echo "GitHub environment variable RAILWAY_API_SERVICE is required" >&2; exit 1; }
          [ "$RELEASE_SERVICE" = "$EXPECTED_SERVICE" ] || { echo "Railway service does not match the selected environment" >&2; exit 1; }
          ARCHIVE_AUDIT_SERVICE_ID="$ARCHIVE_AUDIT_SERVICE_ID" RAILWAY_ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" node <<'NODE'
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          if (!uuid.test(process.env.ARCHIVE_AUDIT_SERVICE_ID ?? '')) {
            throw new Error('RAILWAY_ARCHIVE_AUDIT_SERVICE_ID must be a UUID');
          }
          if (!uuid.test(process.env.RAILWAY_ENVIRONMENT_ID ?? '')) {
            throw new Error('RAILWAY_ENVIRONMENT_ID must be a UUID');
          }
          NODE
          if [ "$RELEASE_ENVIRONMENT" = production ]; then
            [ "$CALLER_WORKFLOW_REF" = "$EXPECTED_PROMOTION_WORKFLOW_REF" ] || { echo "Production is only callable through cabinet-release.yml on main" >&2; exit 1; }
            [ "$RELEASE_REF" = refs/heads/main ] || { echo "Production requires refs/heads/main" >&2; exit 1; }
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      # Construit @bob/api ET ses dépendances workspace (@bob/core, @bob/ai, …) :
      # les tests résolvent les packages via leur entry dist.
      - run: pnpm --filter "@bob/api..." build
      - run: pnpm --filter @bob/core test:cabinet:coverage
      - run: pnpm --filter @bob/api typecheck
      - run: pnpm --filter @bob/api lint
      - run: pnpm --filter @bob/api test
      - name: Embed the revision that Railway will actually upload
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: node apps/api/scripts/write-release-metadata.mjs "$GITHUB_SHA" "$RELEASE_ENVIRONMENT"
      - run: docker build -f Dockerfile -t bob-pro-api:ci .
      - name: Install pinned Railway CLI
        run: sh apps/api/scripts/install-railway-cli.sh
      - name: Gate process-local throttling to one Railway replica
        timeout-minutes: 2
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          timeout 20s railway status --environment "$TARGET_ENVIRONMENT_NAME" --json \
            | node apps/api/scripts/certify-railway-single-replica.mjs "$TARGET_ENVIRONMENT_NAME" "$RAILWAY_SERVICE"
      # Deux trains obligatoires pour l'archive V2 : aucune migration ne peut empêcher une
      # ancienne réplique de RENVOYER en mémoire un XML B2C. Le prédécesseur doit donc déjà
      # publier le fence HTTP old-schema-compatible, puis être l'unique réplique active.
      - name: Certify predecessor B2C HTTP fence before archive expansion
        id: predecessor_capabilities
        timeout-minutes: 3
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node <<'NODE'
          const url = new URL(process.env.API_BASE_URL ?? '');
          if (url.protocol !== 'https:') throw new Error('API_BASE_URL must use https');
          NODE
          body="$(mktemp)"
          fenced=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 3 --max-time 10 \
              "$API_BASE_URL/health/ready" >"$body"
            then
              if HEALTH_BODY="$body" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.HEALTH_BODY, 'utf8'));
          if (payload?.ready !== true) process.exit(1);
          if (payload?.capabilities?.documentArchiveB2cHttpFence !== 'v1') process.exit(1);
          NODE
              then
                fenced=true
                break
              fi
            fi
            sleep 5
          done
          [ "$fenced" = true ] || {
            echo "Refusing archive migrations: deployed predecessor lacks documentArchiveB2cHttpFence=v1" >&2
            exit 1
          }
          realtime_cancellation_fence=false
          if HEALTH_BODY="$body" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.HEALTH_BODY, 'utf8'));
          if (payload?.capabilities?.realtimeAdmissionCancellationFence !== 'v1') process.exit(1);
          NODE
          then
            realtime_cancellation_fence=true
          fi
          echo "realtime_cancellation_fence=$realtime_cancellation_fence" >> "$GITHUB_OUTPUT"
      # Inputs texte libre passés via env (jamais interpolés dans le shell) — anti-injection.
      - name: Expand schema, spool notification delivery, and certify RLS
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          REALTIME_CANCELLATION_FENCE_PREDECESSOR_CAPABLE: ${{ steps.predecessor_capabilities.outputs.realtime_cancellation_fence }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" sh apps/api/scripts/check-release-env.sh
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" \
            env BOB_RELEASE_PHASE=predeploy \
              REALTIME_CANCELLATION_FENCE_PREDECESSOR_CAPABLE="$REALTIME_CANCELLATION_FENCE_PREDECESSOR_CAPABLE" \
              sh apps/api/scripts/release.sh
      - name: Deploy API and wait for the new revision
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
        # Attached mode streams build + deployment logs and exits non-zero when
        # the uploaded revision fails. Detached mode could smoke the old revision.
        run: railway up --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME"
      - name: Re-certify the deployed replica topology
        timeout-minutes: 3
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          certified=false
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --environment "$TARGET_ENVIRONMENT_NAME" --json \
              | node apps/api/scripts/certify-railway-single-replica.mjs "$TARGET_ENVIRONMENT_NAME" "$RAILWAY_SERVICE"
            then
              certified=true
              break
            fi
            sleep 5
          done
          [ "$certified" = true ] || {
            echo "Railway kept more than one active process after the bounded teardown window" >&2
            exit 1
          }
      - name: Smoke API readiness
        id: readiness
        timeout-minutes: 3
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EXPECTED_RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          node <<'NODE'
          const raw = process.env.API_BASE_URL ?? '';
          const url = new URL(raw);
          if (url.protocol !== 'https:') throw new Error('GitHub environment variable API_BASE_URL must use https');
          NODE
          body="$(mktemp)"
          matched=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 3 --max-time 10 \
              "$API_BASE_URL/health/ready" >"$body"
            then
              if HEALTH_BODY="$body" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.HEALTH_BODY, 'utf8'));
          if (payload?.ready !== true) process.exit(1);
          if (payload?.release?.sha !== process.env.EXPECTED_RELEASE_SHA) process.exit(1);
          if (payload?.release?.environment !== process.env.EXPECTED_RELEASE_ENVIRONMENT) process.exit(1);
          if (payload?.capabilities?.realtimeAdmissionCancellationFence !== 'v1') process.exit(1);
          if (payload?.capabilities?.agentMissionBootstrapReceipt !== 'v1') process.exit(1);
          if (payload?.network?.clientIpSource !== 'railway-x-real-ip') process.exit(1);
          NODE
              then
                matched=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$matched" != true ]; then
            echo "The expected Railway revision never became ready" >&2
            exit 1
          fi
          metrics_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 3 --max-time 10 \
              "$API_BASE_URL/metrics"
          )"
          case "$metrics_status" in
            401|403) ;;
            *) echo "Unauthenticated /metrics must be denied, got HTTP $metrics_status" >&2; exit 1 ;;
          esac
          echo "api_base_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "release_sha=$EXPECTED_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_environment=$EXPECTED_RELEASE_ENVIRONMENT" >> "$GITHUB_OUTPUT"
      - name: Postdeploy certify and reopen Bob Live
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" \
            env BOB_RELEASE_PHASE=postdeploy sh apps/api/scripts/release.sh
      - name: Reserve the archive audit and cleanup time budget
        if: ${{ success() && !cancelled() }}
        env:
          RELEASE_JOB_STARTED_AT: ${{ env.BOB_RELEASE_JOB_STARTED_AT }}
        run: |
          node <<'NODE'
          const startedAt = Number(process.env.RELEASE_JOB_STARTED_AT);
          const now = Math.floor(Date.now() / 1_000);
          const elapsedSeconds = now - startedAt;
          if (!Number.isSafeInteger(startedAt) || !Number.isSafeInteger(elapsedSeconds) || elapsedSeconds < 0) {
            throw new Error('Release job time budget is invalid');
          }
          if (elapsedSeconds > 10_800) {
            throw new Error('Refusing to start the archive audit without its cleanup time budget');
          }
          NODE
      - name: Preflight and run the isolated Railway archive byte-audit
        id: archive_audit
        if: ${{ success() && !cancelled() }}
        timeout-minutes: 100
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ARCHIVE_AUDIT_SERVICE_ID: ${{ vars.RAILWAY_ARCHIVE_AUDIT_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RELEASE_SHA: ${{ github.sha }}
          DOCUMENT_ARCHIVE_AUDIT_CI_EVIDENCE: ${{ github.workspace }}/.release-evidence/document-archive/audit-${{ github.sha }}.json
          DOCUMENT_ARCHIVE_AUDIT_TIMEOUT_SECONDS: '5400'
          # Railway's public API is quota-bound; the runner rejects any cadence below 10 s.
          DOCUMENT_ARCHIVE_AUDIT_POLL_SECONDS: '10'
        run: node apps/api/scripts/run-railway-document-archive-audit.mjs
      - name: Reconcile an interrupted Railway archive audit
        if: ${{ always() && (steps.archive_audit.outcome == 'failure' || steps.archive_audit.outcome == 'cancelled') }}
        timeout-minutes: 4
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ARCHIVE_AUDIT_SERVICE_ID: ${{ vars.RAILWAY_ARCHIVE_AUDIT_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RELEASE_SHA: ${{ github.sha }}
          DOCUMENT_ARCHIVE_AUDIT_CI_EVIDENCE: ${{ github.workspace }}/.release-evidence/document-archive/audit-${{ github.sha }}.json
          DOCUMENT_ARCHIVE_AUDIT_TIMEOUT_SECONDS: '5400'
          DOCUMENT_ARCHIVE_AUDIT_POLL_SECONDS: '10'
        run: node apps/api/scripts/run-railway-document-archive-audit.mjs --cleanup-only
      - name: Preserve the non-PII archive audit envelope
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: document-archive-${{ inputs.environment }}-${{ github.sha }}
          path: .release-evidence/document-archive/
          if-no-files-found: error
          retention-days: 90
      - name: Retire the previous Mistral key, activate archive/settlement/outbox v2 and certify the contract
        if: ${{ success() && steps.archive_audit.outcome == 'success' }}
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT_NAME: ${{ inputs.environment }}
        # Les activations n'interviennent qu'après readiness du SHA et preuve mono-réplique.
        # Avant cette étape, N-1 peut continuer les écritures V1 et les messages restent spoolés.
        # Après activation, tout rollback N-1 est interdit : seule une correction roll-forward est sûre.
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" node apps/api/scripts/manage-mistral-conversation-key-version.mjs retire
          DOCUMENT_ARCHIVE_V2_ACTIVATION_RELEASE_SHA="$GITHUB_SHA" \
            railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" sh apps/api/scripts/activate-document-archive-v2.sh
          INVOICE_SETTLEMENT_V2_ACTIVATION_RELEASE_SHA="$GITHUB_SHA" \
            railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" sh apps/api/scripts/activate-invoice-settlement-v2.sh
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" sh apps/api/scripts/activate-notification-outbox-v2.sh
          railway run --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT_NAME" \
            env BOB_RELEASE_PHASE=postdeploy sh apps/api/scripts/release.sh
