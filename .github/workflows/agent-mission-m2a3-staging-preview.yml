name: AgentMission M2-A-3 Staging Preview

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Persistent staging preview operation
        required: true
        default: activate
        type: choice
        options:
          - activate
          - deactivate
      expected_sha:
        description: Exact staging revision already released normally
        required: true
        type: string
      normal_staging_release_run_id:
        description: Successful normal staging release run for the exact SHA (activation only)
        required: false
        default: ''
        type: string
      founder_authorization_date:
        description: Founder authorization date (YYYY-MM-DD)
        required: false
        default: ''
        type: string
      founder_authorization_channel:
        description: Channel containing the founder authorization
        required: false
        default: ''
        type: string
      founder_authorization_ref:
        description: Immutable founder authorization reference
        required: false
        default: ''
        type: string
      claude_countersign_ref:
        description: Immutable Claude countersignature reference
        required: false
        default: ''
        type: string
      gpt_countersign_ref:
        description: Immutable GPT countersignature reference
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      mode:
        description: Persistent staging preview operation
        required: true
        type: string
      expected_sha:
        description: Exact staging revision already released normally
        required: true
        type: string
      normal_staging_release_run_id:
        description: Successful normal staging release run for the exact SHA (activation only)
        required: false
        default: ''
        type: string
      founder_authorization_date:
        description: Founder authorization date (YYYY-MM-DD)
        required: false
        default: ''
        type: string
      founder_authorization_channel:
        description: Channel containing the founder authorization
        required: false
        default: ''
        type: string
      founder_authorization_ref:
        description: Immutable founder authorization reference
        required: false
        default: ''
        type: string
      claude_countersign_ref:
        description: Immutable Claude countersignature reference
        required: false
        default: ''
        type: string
      gpt_countersign_ref:
        description: Immutable GPT countersignature reference
        required: false
        default: ''
        type: string

concurrency:
  group: railway-api-staging
  cancel-in-progress: false

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  SUPABASE_URL: https://${{ vars.BOB_M1B_STAGING_SUPABASE_PROJECT_REF }}.supabase.co
  RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
  RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
  RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
  BOB_M1B_RELEASE_SHA: ${{ github.sha }}
  BOB_M1B_STAGING_USER_ID: ${{ vars.BOB_M1B_STAGING_USER_ID }}
  BOB_M1B_STAGING_COMPANY_ID: ${{ vars.BOB_M1B_STAGING_COMPANY_ID }}
  BOB_M1B_STAGING_HMAC_KEY_VERSION: ${{ vars.BOB_M1B_STAGING_HMAC_KEY_VERSION }}
  BOB_M1B_STAGING_RUN_ID: ${{ github.run_id }}
  BOB_M1B_STAGING_SUPABASE_PROJECT_REF: ${{ vars.BOB_M1B_STAGING_SUPABASE_PROJECT_REF }}
  BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER: ${{ vars.BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER }}
  BOB_M1B_STAGING_DATABASE_OID: ${{ vars.BOB_M1B_STAGING_DATABASE_OID }}
  BOB_M1B_STAGING_DATABASE_NAME: ${{ vars.BOB_M1B_STAGING_DATABASE_NAME }}
  BOB_AGENT_MISSION_STAGING_PROFILE: m2a3-preview
  BOB_M2A3_STAGING_PREVIEW_RELEASE_SHA: ${{ inputs.expected_sha }}
  BOB_M2A3_STAGING_RELEASE_SHA: ${{ inputs.expected_sha }}
  BOB_M2A3_STAGING_RUN_ID: ${{ github.run_id }}
  BOB_M2A3_STAGING_RUN_ATTEMPT: ${{ github.run_attempt }}
  BOB_M2A3_STAGING_INITIATOR: ${{ github.actor }}
  BOB_M2A3_STAGING_REPOSITORY: ${{ github.repository }}
  BOB_M2A3_STAGING_USER_ID: ${{ vars.BOB_M1B_STAGING_USER_ID }}
  BOB_M2A3_STAGING_FOUNDER_AUTH_DATE: ${{ inputs.founder_authorization_date }}
  BOB_M2A3_STAGING_FOUNDER_AUTH_CHANNEL: ${{ inputs.founder_authorization_channel }}
  BOB_M2A3_STAGING_FOUNDER_AUTH_REF: ${{ inputs.founder_authorization_ref }}
  BOB_M2A3_STAGING_CLAUDE_COUNTERSIGN_REF: ${{ inputs.claude_countersign_ref }}
  BOB_M2A3_STAGING_GPT_COUNTERSIGN_REF: ${{ inputs.gpt_countersign_ref }}

jobs:
  activate:
    if: ${{ always() && inputs.mode == 'activate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    outputs:
      started_at: ${{ steps.initialize.outputs.started_at }}
      deployment_id: ${{ steps.deploy_active.outputs.deployment_id }}
      rollback_required: ${{ steps.arm_rollback.outputs.required || 'false' }}
      capacity_restore_required: ${{ steps.arm_capacity_restore.outputs.required || 'false' }}
      baseline_release_sha: ${{ steps.baseline_runtime.outputs.release_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the immutable staging-only activation request
        id: initialize
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NORMAL_STAGING_RELEASE_RUN_ID: ${{ inputs.normal_staging_release_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require('node:fs');
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const sha = /^[a-f0-9]{40}$/;
          const required = [
            'API_BASE_URL', 'SUPABASE_URL', 'RAILWAY_PROJECT_ID', 'RAILWAY_ENVIRONMENT_ID',
            'RAILWAY_API_SERVICE_ID', 'BOB_M1B_STAGING_USER_ID', 'BOB_M1B_STAGING_COMPANY_ID',
            'BOB_M1B_STAGING_HMAC_KEY_VERSION', 'BOB_M1B_STAGING_SUPABASE_PROJECT_REF',
            'BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER', 'BOB_M1B_STAGING_DATABASE_OID',
            'BOB_M1B_STAGING_DATABASE_NAME', 'BOB_M2A3_STAGING_FOUNDER_AUTH_DATE',
            'BOB_M2A3_STAGING_RUN_ATTEMPT', 'BOB_M2A3_STAGING_INITIATOR',
            'BOB_M2A3_STAGING_REPOSITORY', 'NORMAL_STAGING_RELEASE_RUN_ID',
            'BOB_M2A3_STAGING_FOUNDER_AUTH_CHANNEL', 'BOB_M2A3_STAGING_FOUNDER_AUTH_REF',
            'BOB_M2A3_STAGING_CLAUDE_COUNTERSIGN_REF', 'BOB_M2A3_STAGING_GPT_COUNTERSIGN_REF',
            'RAILWAY_TOKEN', 'BOB_M1B_STAGING_HMAC_KEYRING',
            'BOB_M1B_STAGING_SUPABASE_ANON_KEY', 'BOB_M1B_STAGING_ACCOUNT_EMAIL',
            'BOB_M1B_STAGING_ACCOUNT_PASSWORD',
          ];
          for (const name of required) {
            const value = process.env[name];
            if (typeof value !== 'string' || value.length < 1 || value.length > 16_384) {
              throw new Error(`${name} is required by the staging preview environment`);
            }
          }
          if (!sha.test(process.env.GITHUB_SHA ?? '')) throw new Error('GITHUB_SHA must be exact');
          if (!/^[1-9][0-9]{0,19}$/.test(process.env.NORMAL_STAGING_RELEASE_RUN_ID ?? '')) {
            throw new Error('NORMAL_STAGING_RELEASE_RUN_ID must be an exact GitHub run id');
          }
          for (const name of [
            'RAILWAY_PROJECT_ID', 'RAILWAY_ENVIRONMENT_ID', 'RAILWAY_API_SERVICE_ID',
            'BOB_M1B_STAGING_USER_ID',
          ]) {
            if (!uuid.test(process.env[name] ?? '')) throw new Error(`${name} must be a UUID`);
          }
          for (const name of ['API_BASE_URL', 'SUPABASE_URL']) {
            const value = process.env[name];
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.origin !== value) {
              throw new Error(`${name} must be an exact HTTPS origin`);
            }
          }
          const decisionPath =
            'design_handoff_bob_pro/DECISION_M2A3_STAGING_PREVIEW_20260731.md';
          const decision = fs.readFileSync(decisionPath, 'utf8');
          const expected = {
            BOB_M2A3_STAGING_FOUNDER_AUTH_DATE: '2026-07-31',
            BOB_M2A3_STAGING_FOUNDER_AUTH_CHANNEL: 'conversation-codex',
            BOB_M2A3_STAGING_FOUNDER_AUTH_REF: 'decision:M2A3-20260731#founder',
            BOB_M2A3_STAGING_CLAUDE_COUNTERSIGN_REF: 'decision:M2A3-20260731#claude',
            BOB_M2A3_STAGING_GPT_COUNTERSIGN_REF: 'decision:M2A3-20260731#gpt',
          };
          for (const [name, value] of Object.entries(expected)) {
            if (process.env[name] !== value) {
              throw new Error(`${name} does not match the exact-SHA governance receipt`);
            }
          }
          for (const marker of [
            '- Décision : `M2A3_STAGING_PREVIEW_GLOBAL_ON`',
            '- Environnement autorisé : `staging`',
            '- Production : `UNCHANGED_OFF`',
            '- Contre-signature GPT : `ACK`',
            '- Contre-signature Claude : `ACK`',
          ]) {
            if (!decision.includes(marker)) {
              throw new Error(`governance receipt is not fully countersigned: ${marker}`);
            }
          }
          NODE
          run_receipt="$(mktemp)"
          artifacts_receipt="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NORMAL_STAGING_RELEASE_RUN_ID" \
            > "$run_receipt"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$NORMAL_STAGING_RELEASE_RUN_ID/artifacts?per_page=100" \
            > "$artifacts_receipt"
          NORMAL_RELEASE_RECEIPT="$run_receipt" NORMAL_RELEASE_ARTIFACTS="$artifacts_receipt" \
            node <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync(process.env.NORMAL_RELEASE_RECEIPT, 'utf8'));
          const artifacts = JSON.parse(fs.readFileSync(process.env.NORMAL_RELEASE_ARTIFACTS, 'utf8'));
          const expectedRunId = process.env.NORMAL_STAGING_RELEASE_RUN_ID;
          const expectedArtifact = `api-release-receipt-staging-${process.env.GITHUB_SHA}`;
          const matches = Array.isArray(artifacts?.artifacts)
            ? artifacts.artifacts.filter((artifact) => artifact?.name === expectedArtifact)
            : [];
          if (
            String(run?.id) !== expectedRunId
            || run?.name !== 'Railway API Release'
            || run?.path !== '.github/workflows/railway-api.yml'
            || run?.event !== 'workflow_dispatch'
            || run?.head_branch !== 'main'
            || run?.head_sha !== process.env.GITHUB_SHA
            || run?.conclusion !== 'success'
            || matches.length !== 1
            || matches[0]?.expired !== false
            || String(matches[0]?.workflow_run?.id) !== expectedRunId
          ) {
            throw new Error('the exact SHA lacks one successful normal staging release receipt');
          }
          NODE
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Prepare the exact activation artifact and its canary
        env:
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          test "$(psql --version | awk '{print $3}' | cut -d. -f1)" = 16
          pnpm install --frozen-lockfile
          pnpm --filter "@bob/api..." build
          pnpm --filter "@bob/api-client..." build
          pnpm --filter @bob/web exec playwright install --with-deps chromium
          sh apps/api/scripts/install-railway-cli.sh
          node --test \
            apps/api/scripts/agent-mission-m1b-staging-railway.test.mjs \
            apps/api/scripts/agent-mission-m1b-staging-release.test.mjs \
            apps/api/scripts/agent-mission-m1b-staging-smoke.test.mjs \
            apps/api/scripts/agent-mission-m2a3-staging-preview-flag.test.mjs \
            apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.test.mjs \
            apps/api/scripts/agent-mission-m2a3-staging-preview-report.test.mjs \
            apps/api/scripts/agent-mission-m2a3-staging-preview-workflow.test.mjs \
            apps/api/scripts/agent-mission-m1b-staging-release-safety.test.mjs \
            apps/api/scripts/release-flag-ops.test.mjs
          node apps/api/scripts/write-release-metadata.mjs "$GITHUB_SHA" staging
          node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs preflight
      - name: Require the normally released exact SHA and a fully OFF baseline
        id: baseline_runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          baseline_deployment_id=''
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$status_file" \
              && node apps/api/scripts/certify-railway-single-replica.mjs \
                staging "$RAILWAY_API_SERVICE_ID" < "$status_file" \
              && baseline_deployment_id="$(
                node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
                  serving-deployment-id < "$status_file"
              )"
            then
              break
            fi
            sleep 5
          done
          test -n "$baseline_deployment_id"
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          confirmed_status_file="$(mktemp)"
          timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$confirmed_status_file"
          confirmed_deployment_id="$(
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
              serving-deployment-id < "$confirmed_status_file"
          )"
          test "$confirmed_deployment_id" = "$baseline_deployment_id"
          printf '%s\n' \
            "deployment_id=$baseline_deployment_id" \
            "release_sha=$GITHUB_SHA" \
            >> "$GITHUB_OUTPUT"
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs preflight
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs preflight
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-key-state.mjs bootstrap
      - name: Arm DB-first rollback before the first mutation
        id: arm_rollback
        run: echo "required=true" >> "$GITHUB_OUTPUT"
      - name: Open Mission V2 only for the dedicated staging canary
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs enable-canary
          node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs assert-canary
      - name: Stage the persistent V1 plus V2 Railway runtime block without auto-deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs activate
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-active
      - name: Arm capacity restoration immediately before predeploy
        id: arm_capacity_restore
        run: echo "required=true" >> "$GITHUB_OUTPUT"
      - name: Close and certify the exact active predeploy state
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env RELEASE_ENVIRONMENT=staging BOB_RELEASE_EXPECTED_ENV=staging \
              sh apps/api/scripts/check-release-env.sh
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs predeploy
      - name: Deploy the exact SHA with Mission V2 runtime enabled
        id: deploy_active
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          deployment_id="$(
            railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --detach --json \
              | node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deployment-id
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
            wait-deployment "$deployment_id"
      - name: Prove the active runtime, writer and canary-only authority
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          set -euo pipefail
          expected_deployment_id="${{ steps.deploy_active.outputs.deployment_id }}"
          status_file="$(mktemp)"
          topology=false
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$status_file" \
              && node apps/api/scripts/certify-railway-single-replica.mjs \
                staging "$RAILWAY_API_SERVICE_ID" < "$status_file" \
              && serving_deployment_id="$(
                node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
                  serving-deployment-id < "$status_file"
              )" \
              && test "$serving_deployment_id" = "$expected_deployment_id"
            then
              topology=true
              break
            fi
            sleep 5
          done
          test "$topology" = true
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs postdeploy
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-active
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-key-state.mjs active
          node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs assert-canary
      - name: Prove authenticated WebRTC V2 before global activation
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
        run: |
          set -euo pipefail
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          canary_flag_observation="$(
            BOB_M2A3_STAGING_OUTPUT=json \
              node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs \
                assert-canary \
              | tail -n 1
          )"
          canary_smoke_observation="$(
            railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
              node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs preview-v2 \
              | tail -n 1
          )"
          printf '%s\n' \
            "BOB_M2A3_PREVIEW_CANARY_FLAG_OBSERVATION=$canary_flag_observation" \
            "BOB_M2A3_PREVIEW_CANARY_SMOKE_OBSERVATION=$canary_smoke_observation" \
            >> "$GITHUB_ENV"
      - name: Remove the canary override before opening the global flag
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs disable-canary
          node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs assert-off
      - name: Activate Mission V2 globally on staging with zero subject override
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs activate
          node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs assert-active
      - name: Prove the global GPT Realtime V2 baseline end to end
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
          BOB_M2A3_PREVIEW_MODE: activate
          BOB_M2A3_PREVIEW_RELEASE_SHA: ${{ github.sha }}
          BOB_M2A3_PREVIEW_NORMAL_RELEASE_RUN_ID: ${{ inputs.normal_staging_release_run_id }}
          BOB_M2A3_PREVIEW_RUN_ID: ${{ github.run_id }}
          BOB_M2A3_PREVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          BOB_M2A3_PREVIEW_DEPLOYMENT_ID: ${{ steps.deploy_active.outputs.deployment_id }}
          BOB_M2A3_PREVIEW_STARTED_AT: ${{ steps.initialize.outputs.started_at }}
        run: |
          set -euo pipefail
          expected_deployment_id="${{ steps.deploy_active.outputs.deployment_id }}"
          status_file="$(mktemp)"
          topology_observation=''
          serving_exact=false
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$status_file" \
              && topology_observation="$(
                node apps/api/scripts/certify-railway-single-replica.mjs \
                  staging "$RAILWAY_API_SERVICE_ID" < "$status_file"
              )" \
              && serving_deployment_id="$(
                node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
                  serving-deployment-id < "$status_file"
              )" \
              && test "$serving_deployment_id" = "$expected_deployment_id"
            then
              serving_exact=true
              break
            fi
            topology_observation=''
            sleep 5
          done
          test "$serving_exact" = true
          readiness_observation="$(node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs)"
          runtime_observation="$(
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-active
          )"
          key_observation="$(
            railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
              node apps/api/scripts/agent-mission-m1b-staging-key-state.mjs active \
              | tail -n 1
          )"
          flag_observation="$(
            BOB_M2A3_STAGING_OUTPUT=json \
              node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs \
                assert-active \
              | tail -n 1
          )"
          smoke_observation="$(
            railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
              node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs preview-v2 \
              | tail -n 1
          )"
          decision_digest="$(sha256sum \
            design_handoff_bob_pro/DECISION_M2A3_STAGING_PREVIEW_20260731.md \
            | awk '{print $1}')"
          finished_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          file=".release-evidence/agent-mission-m2a3-preview/${GITHUB_SHA}.json"
          BOB_M2A3_PREVIEW_FINISHED_AT="$finished_at" \
          BOB_M2A3_PREVIEW_RUNTIME_OBSERVATION="$runtime_observation" \
          BOB_M2A3_PREVIEW_KEY_OBSERVATION="$key_observation" \
          BOB_M2A3_PREVIEW_FLAG_OBSERVATION="$flag_observation" \
          BOB_M2A3_PREVIEW_TOPOLOGY_OBSERVATION="$topology_observation" \
          BOB_M2A3_PREVIEW_READINESS_OBSERVATION="$readiness_observation" \
          BOB_M2A3_PREVIEW_SMOKE_OBSERVATION="$smoke_observation" \
          BOB_M2A3_PREVIEW_DECISION_DOCUMENT_SHA256="$decision_digest" \
            node apps/api/scripts/agent-mission-m2a3-staging-preview-report.mjs write "$file"
          node apps/api/scripts/agent-mission-m2a3-staging-preview-report.mjs verify "$file"
      - name: Preserve the live-observed active receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-mission-m2a3-staging-preview-active-${{ github.sha }}
          path: .release-evidence/agent-mission-m2a3-preview/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Force the database authority safe inline if activation did not complete
        if: ${{ always() && steps.arm_rollback.outputs.required == 'true' && (failure() || cancelled()) }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          run_flag() {
            node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs "$1"
          }
          if run_flag assert-off; then
            exit 0
          fi
          if run_flag assert-active && run_flag deactivate && run_flag assert-off; then
            exit 0
          fi
          if run_flag assert-canary && run_flag disable-canary && run_flag assert-off; then
            exit 0
          fi
          run_flag emergency-kill
          run_flag assert-effective-safe

  rollback-activation:
    needs: activate
    if: ${{ always() && inputs.mode == 'activate' && needs.activate.result != 'success' && needs.activate.outputs.rollback_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: staging
    outputs:
      deployment_id: ${{ steps.deploy_off.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and timestamp the exact-SHA fail-safe request
        id: initialize
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test -n "$RAILWAY_TOKEN"
          test -n "$BOB_M1B_STAGING_HMAC_KEYRING"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
      - name: Install only the pinned staging safety control plane
        run: |
          test "$GITHUB_REF" = refs/heads/main
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          test "$(psql --version | awk '{print $3}' | cut -d. -f1)" = 16
          sh apps/api/scripts/install-railway-cli.sh
      - name: Restore the database authority to OFF before runtime rollback
        id: database_safety
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          run_flag() {
            node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs "$1"
          }
          canonical=false
          if run_flag assert-off; then
            canonical=true
          elif run_flag assert-active && run_flag deactivate && run_flag assert-off; then
            canonical=true
          elif run_flag assert-canary && run_flag disable-canary && run_flag assert-off; then
            canonical=true
          else
            run_flag emergency-kill
            run_flag assert-effective-safe
          fi
          echo "safe=true" >> "$GITHUB_OUTPUT"
          echo "canonical=$canonical" >> "$GITHUB_OUTPUT"
      - name: Bind rollback to the pre-mutation normal-release baseline after DB safety
        id: source_runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
          BASELINE_RELEASE_SHA: ${{ needs.activate.outputs.baseline_release_sha }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          status_file="$(mktemp)"
          source_deployment_id=''
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$status_file" \
              && source_deployment_id="$(
                node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
                  serving-deployment-id < "$status_file"
              )"
            then
              break
            fi
            sleep 5
          done
          test -n "$source_deployment_id"
          readiness_observation="$(
            node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs observe
          )"
          served_release_sha="${readiness_observation##*:}"
          test "$served_release_sha" = "$BASELINE_RELEASE_SHA"
          git merge-base --is-ancestor "$served_release_sha" "$GITHUB_SHA"
          runtime_state=''
          owned_release_sha=''
          if owned_observation="$(
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs inspect-owned-preview
          )"; then
            if [[ "$owned_observation" =~ :sha-([a-f0-9]{40}):run-([1-9][0-9]*)$ ]]; then
              owned_release_sha="${BASH_REMATCH[1]}"
            else
              echo "The owned preview observation is malformed" >&2
              exit 1
            fi
            test "$owned_release_sha" = "$BASELINE_RELEASE_SHA"
            runtime_state=active-owned
          else
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
              assert-rebuildable-off-source
            runtime_state=already-off
          fi
          printf '%s\n' \
            "deployment_id=$source_deployment_id" \
            "release_sha=$served_release_sha" \
            "runtime_state=$runtime_state" \
            "owned_release_sha=$owned_release_sha" \
            >> "$GITHUB_OUTPUT"
      - name: Checkout the exact rollback source after DB safety
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.source_runtime.outputs.release_sha }}
          path: .m2a3-serving-source
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Prepare the rollback control plane after DB safety
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@bob/api..." build
          pnpm --filter "@bob/api-client..." build
          pnpm --filter @bob/web exec playwright install --with-deps chromium
      - name: Arm capacity restoration immediately before rollback predeploy
        id: rollback_arm_capacity_restore
        run: echo "required=true" >> "$GITHUB_OUTPUT"
      - name: Close and drain before removing the owned runtime block
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs predeploy
      - name: Restore the explicit M2-A false Railway baseline
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deactivate
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-off
      - name: Rebuild the captured normal-release source with current OFF variables
        id: deploy_off
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/.m2a3-serving-source"
          source_release_sha="${{ steps.source_runtime.outputs.release_sha }}"
          test "$(git -C "$source_root" rev-parse HEAD)" = "$source_release_sha"
          test -z "$(git -C "$source_root" status --short)"
          node "$source_root/apps/api/scripts/write-release-metadata.mjs" \
            "$source_release_sha" staging
          test "$(git -C "$source_root" status --short)" = "?? .bob-release.json"
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-off
          status_file="$(mktemp)"
          timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$status_file"
          current_deployment_id="$(
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
              serving-deployment-id < "$status_file"
          )"
          test "$current_deployment_id" = "${{ steps.source_runtime.outputs.deployment_id }}"
          deployment_id="$(
            railway up "$source_root" --path-as-root \
              --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --detach --json \
              | node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deployment-id
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
            wait-deployment "$deployment_id"
      - name: Prove the fully OFF runtime and negotiation
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
          DB_CANONICAL_OFF: ${{ steps.database_safety.outputs.canonical }}
          BOB_M2A3_PREVIEW_MODE: deactivate
          BOB_M1B_RELEASE_SHA: ${{ steps.source_runtime.outputs.release_sha }}
          BOB_M2A3_PREVIEW_RELEASE_SHA: ${{ steps.source_runtime.outputs.release_sha }}
          BOB_M2A3_PREVIEW_RUN_ID: ${{ github.run_id }}
          BOB_M2A3_PREVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          BOB_M2A3_PREVIEW_DEPLOYMENT_ID: ${{ steps.deploy_off.outputs.deployment_id }}
          BOB_M2A3_PREVIEW_STARTED_AT: ${{ needs.activate.outputs.started_at }}
          BOB_M2A3_PREVIEW_CONTROL_SHA: ${{ github.sha }}
          BOB_M2A3_PREVIEW_SOURCE_DEPLOYMENT_ID: ${{ steps.source_runtime.outputs.deployment_id }}
          BOB_M2A3_PREVIEW_SOURCE_RELEASE_SHA: ${{ steps.source_runtime.outputs.release_sha }}
          BOB_M2A3_PREVIEW_SOURCE_RUNTIME_STATE: ${{ steps.source_runtime.outputs.runtime_state }}
          BOB_M2A3_PREVIEW_SOURCE_OWNED_RELEASE_SHA: ${{ steps.source_runtime.outputs.owned_release_sha }}
          BOB_M2A3_PREVIEW_DEPLOYMENT_ACTION: captured-baseline-source-rebuild
        run: |
          set -euo pipefail
          expected_deployment_id="${{ steps.deploy_off.outputs.deployment_id }}"
          status_file="$(mktemp)"
          topology_observation=''
          serving_exact=false
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$status_file" \
              && topology_observation="$(
                node apps/api/scripts/certify-railway-single-replica.mjs \
                  staging "$RAILWAY_API_SERVICE_ID" < "$status_file"
              )" \
              && serving_deployment_id="$(
                node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
                  serving-deployment-id < "$status_file"
              )" \
              && test "$serving_deployment_id" = "$expected_deployment_id"
            then
              serving_exact=true
              break
            fi
            topology_observation=''
            sleep 5
          done
          test "$serving_exact" = true
          readiness_observation="$(node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs)"
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs postdeploy
          runtime_observation="$(
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-off
          )"
          key_observation="$(
            railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
              node apps/api/scripts/agent-mission-m1b-staging-key-state.mjs off \
              | tail -n 1
          )"
          if [ "$DB_CANONICAL_OFF" = true ]; then
            flag_observation="$(
              BOB_M2A3_STAGING_OUTPUT=json \
                node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs \
                  assert-off \
                | tail -n 1
            )"
          else
            node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs \
              assert-effective-safe
          fi
          readiness_observation="$(node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs)"
          smoke_observation="$(
            railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
              node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs preview-v2-off \
              | tail -n 1
          )"
          if [ "$DB_CANONICAL_OFF" = true ]; then
            finished_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
            file=".release-evidence/agent-mission-m2a3-preview/${BOB_M2A3_PREVIEW_RELEASE_SHA}-${GITHUB_RUN_ID}.json"
            BOB_M2A3_PREVIEW_FINISHED_AT="$finished_at" \
            BOB_M2A3_PREVIEW_RUNTIME_OBSERVATION="$runtime_observation" \
            BOB_M2A3_PREVIEW_KEY_OBSERVATION="$key_observation" \
            BOB_M2A3_PREVIEW_FLAG_OBSERVATION="$flag_observation" \
            BOB_M2A3_PREVIEW_TOPOLOGY_OBSERVATION="$topology_observation" \
            BOB_M2A3_PREVIEW_READINESS_OBSERVATION="$readiness_observation" \
            BOB_M2A3_PREVIEW_SMOKE_OBSERVATION="$smoke_observation" \
              node apps/api/scripts/agent-mission-m2a3-staging-preview-report.mjs write "$file"
            node apps/api/scripts/agent-mission-m2a3-staging-preview-report.mjs verify "$file"
          fi
      - name: Preserve the live-observed OFF receipt
        if: ${{ steps.database_safety.outputs.canonical == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-mission-m2a3-staging-preview-off-${{ steps.source_runtime.outputs.release_sha }}-${{ github.run_id }}
          path: .release-evidence/agent-mission-m2a3-preview/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Restore Bob Live capacity only after database safety
        if: ${{ always() && steps.database_safety.outputs.safe == 'true' && (needs.activate.outputs.capacity_restore_required == 'true' || steps.rollback_arm_capacity_restore.outputs.required == 'true') }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs restore-capacity

  deactivate:
    if: ${{ inputs.mode == 'deactivate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: staging
    outputs:
      started_at: ${{ steps.initialize.outputs.started_at }}
      deployment_id: ${{ steps.deploy_off.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and timestamp the exact-SHA fail-safe request
        id: initialize
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test -n "$RAILWAY_TOKEN"
          test -n "$BOB_M1B_STAGING_HMAC_KEYRING"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
      - name: Install only the pinned staging safety control plane
        run: |
          test "$GITHUB_REF" = refs/heads/main
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          test "$(psql --version | awk '{print $3}' | cut -d. -f1)" = 16
          sh apps/api/scripts/install-railway-cli.sh
      - name: Disable the database authority before touching runtime
        id: database_safety
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          run_flag() {
            node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs "$1"
          }
          canonical=false
          if run_flag assert-off; then
            canonical=true
          elif run_flag assert-active && run_flag deactivate && run_flag assert-off; then
            canonical=true
          elif run_flag assert-canary && run_flag disable-canary && run_flag assert-off; then
            canonical=true
          else
            run_flag emergency-kill
            run_flag assert-effective-safe
          fi
          echo "safe=true" >> "$GITHUB_OUTPUT"
          echo "canonical=$canonical" >> "$GITHUB_OUTPUT"
      - name: Bind deactivation to the exact source currently serving after DB safety
        id: source_runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          source_deployment_id=''
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$status_file" \
              && source_deployment_id="$(
                node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
                  serving-deployment-id < "$status_file"
              )"
            then
              break
            fi
            sleep 5
          done
          test -n "$source_deployment_id"
          readiness_observation="$(
            node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs observe
          )"
          served_release_sha="${readiness_observation##*:}"
          git merge-base --is-ancestor "$served_release_sha" "$GITHUB_SHA"
          runtime_state=''
          owned_release_sha=''
          if owned_observation="$(
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs inspect-owned-preview
          )"; then
            if [[ "$owned_observation" =~ :sha-([a-f0-9]{40}):run-([1-9][0-9]*)$ ]]; then
              owned_release_sha="${BASH_REMATCH[1]}"
            else
              echo "The owned preview observation is malformed" >&2
              exit 1
            fi
            test "$owned_release_sha" = "$served_release_sha"
            runtime_state=active-owned
          else
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
              assert-rebuildable-off-source
            runtime_state=already-off
          fi
          printf '%s\n' \
            "deployment_id=$source_deployment_id" \
            "release_sha=$served_release_sha" \
            "runtime_state=$runtime_state" \
            "owned_release_sha=$owned_release_sha" \
            >> "$GITHUB_OUTPUT"
      - name: Checkout the exact serving source after DB safety
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.source_runtime.outputs.release_sha }}
          path: .m2a3-serving-source
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Prepare the deactivation control plane after DB safety
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@bob/api..." build
          pnpm --filter "@bob/api-client..." build
          pnpm --filter @bob/web exec playwright install --with-deps chromium
      - name: Arm capacity restoration immediately before deactivation predeploy
        id: arm_capacity_restore
        run: echo "required=true" >> "$GITHUB_OUTPUT"
      - name: Close and drain before removing the runtime master
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs predeploy
      - name: Restore the explicit Railway OFF baseline
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deactivate
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-off
      - name: Rebuild the exact serving source with current OFF variables
        id: deploy_off
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/.m2a3-serving-source"
          source_release_sha="${{ steps.source_runtime.outputs.release_sha }}"
          test "$(git -C "$source_root" rev-parse HEAD)" = "$source_release_sha"
          test -z "$(git -C "$source_root" status --short)"
          node "$source_root/apps/api/scripts/write-release-metadata.mjs" \
            "$source_release_sha" staging
          test "$(git -C "$source_root" status --short)" = "?? .bob-release.json"
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-off
          status_file="$(mktemp)"
          timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$status_file"
          current_deployment_id="$(
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
              serving-deployment-id < "$status_file"
          )"
          test "$current_deployment_id" = "${{ steps.source_runtime.outputs.deployment_id }}"
          deployment_id="$(
            railway up "$source_root" --path-as-root \
              --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --detach --json \
              | node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deployment-id
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
            wait-deployment "$deployment_id"
      - name: Prove the persistent OFF state and V2 refusal
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
          DB_CANONICAL_OFF: ${{ steps.database_safety.outputs.canonical }}
          BOB_M1B_RELEASE_SHA: ${{ steps.source_runtime.outputs.release_sha }}
          BOB_M2A3_PREVIEW_MODE: deactivate
          BOB_M2A3_PREVIEW_RELEASE_SHA: ${{ steps.source_runtime.outputs.release_sha }}
          BOB_M2A3_PREVIEW_RUN_ID: ${{ github.run_id }}
          BOB_M2A3_PREVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          BOB_M2A3_PREVIEW_DEPLOYMENT_ID: ${{ steps.deploy_off.outputs.deployment_id }}
          BOB_M2A3_PREVIEW_STARTED_AT: ${{ steps.initialize.outputs.started_at }}
          BOB_M2A3_PREVIEW_CONTROL_SHA: ${{ github.sha }}
          BOB_M2A3_PREVIEW_SOURCE_DEPLOYMENT_ID: ${{ steps.source_runtime.outputs.deployment_id }}
          BOB_M2A3_PREVIEW_SOURCE_RELEASE_SHA: ${{ steps.source_runtime.outputs.release_sha }}
          BOB_M2A3_PREVIEW_SOURCE_RUNTIME_STATE: ${{ steps.source_runtime.outputs.runtime_state }}
          BOB_M2A3_PREVIEW_SOURCE_OWNED_RELEASE_SHA: ${{ steps.source_runtime.outputs.owned_release_sha }}
          BOB_M2A3_PREVIEW_DEPLOYMENT_ACTION: exact-source-rebuild
        run: |
          set -euo pipefail
          expected_deployment_id="${{ steps.deploy_off.outputs.deployment_id }}"
          status_file="$(mktemp)"
          topology_observation=''
          serving_exact=false
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --json > "$status_file" \
              && topology_observation="$(
                node apps/api/scripts/certify-railway-single-replica.mjs \
                  staging "$RAILWAY_API_SERVICE_ID" < "$status_file"
              )" \
              && serving_deployment_id="$(
                node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
                  serving-deployment-id < "$status_file"
              )" \
              && test "$serving_deployment_id" = "$expected_deployment_id"
            then
              serving_exact=true
              break
            fi
            topology_observation=''
            sleep 5
          done
          test "$serving_exact" = true
          readiness_observation="$(node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs)"
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs postdeploy
          runtime_observation="$(
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-off
          )"
          key_observation="$(
            railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
              node apps/api/scripts/agent-mission-m1b-staging-key-state.mjs off \
              | tail -n 1
          )"
          if [ "$DB_CANONICAL_OFF" = true ]; then
            flag_observation="$(
              BOB_M2A3_STAGING_OUTPUT=json \
                node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs \
                  assert-off \
                | tail -n 1
            )"
          else
            node apps/api/scripts/agent-mission-m2a3-staging-preview-flag-railway.mjs \
              assert-effective-safe
          fi
          readiness_observation="$(node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs)"
          smoke_observation="$(
            railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
              node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs preview-v2-off \
              | tail -n 1
          )"
          if [ "$DB_CANONICAL_OFF" = true ]; then
            finished_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
            file=".release-evidence/agent-mission-m2a3-preview/${BOB_M2A3_PREVIEW_RELEASE_SHA}-${GITHUB_RUN_ID}.json"
            BOB_M2A3_PREVIEW_FINISHED_AT="$finished_at" \
            BOB_M2A3_PREVIEW_RUNTIME_OBSERVATION="$runtime_observation" \
            BOB_M2A3_PREVIEW_KEY_OBSERVATION="$key_observation" \
            BOB_M2A3_PREVIEW_FLAG_OBSERVATION="$flag_observation" \
            BOB_M2A3_PREVIEW_TOPOLOGY_OBSERVATION="$topology_observation" \
            BOB_M2A3_PREVIEW_READINESS_OBSERVATION="$readiness_observation" \
            BOB_M2A3_PREVIEW_SMOKE_OBSERVATION="$smoke_observation" \
              node apps/api/scripts/agent-mission-m2a3-staging-preview-report.mjs write "$file"
            node apps/api/scripts/agent-mission-m2a3-staging-preview-report.mjs verify "$file"
          fi
      - name: Preserve the live-observed OFF receipt
        if: ${{ steps.database_safety.outputs.canonical == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-mission-m2a3-staging-preview-off-${{ steps.source_runtime.outputs.release_sha }}-${{ github.run_id }}
          path: .release-evidence/agent-mission-m2a3-preview/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Restore Bob Live capacity after safe deactivation
        if: ${{ always() && steps.database_safety.outputs.safe == 'true' && steps.arm_capacity_restore.outputs.required == 'true' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs restore-capacity
      - name: Refuse to report canonical OFF when emergency kills remain armed
        if: ${{ always() && steps.database_safety.outputs.safe == 'true' }}
        env:
          DB_CANONICAL_OFF: ${{ steps.database_safety.outputs.canonical }}
        run: test "$DB_CANONICAL_OFF" = true

  verdict:
    needs:
      - activate
      - rollback-activation
      - deactivate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the requested persistent state and its evidence
        env:
          MODE: ${{ inputs.mode }}
          ACTIVATE_RESULT: ${{ needs.activate.result }}
          ROLLBACK_RESULT: ${{ needs.rollback-activation.result }}
          DEACTIVATE_RESULT: ${{ needs.deactivate.result }}
        run: |
          case "$MODE" in
            activate)
              test "$ACTIVATE_RESULT" = success
              test "$ROLLBACK_RESULT" = skipped
              test "$DEACTIVATE_RESULT" = skipped
              ;;
            deactivate)
              test "$ACTIVATE_RESULT" = skipped
              test "$ROLLBACK_RESULT" = skipped
              test "$DEACTIVATE_RESULT" = success
              ;;
            *) echo "Unsupported staging preview mode" >&2; exit 1 ;;
          esac
