name: Bob Live Native Contracts

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/bob-live-native.yml
      - apps/mobile/app.json
      - apps/mobile/package.json
      - apps/mobile/modules/bob-live-audio/**
      - apps/mobile/src/agent/**
      - apps/mobile/src/audio/**
      - apps/mobile/src/realtime/**
      - packages/ai/src/realtime/**
      - pnpm-lock.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/bob-live-native.yml
      - apps/mobile/app.json
      - apps/mobile/package.json
      - apps/mobile/modules/bob-live-audio/**
      - apps/mobile/src/agent/**
      - apps/mobile/src/audio/**
      - apps/mobile/src/realtime/**
      - packages/ai/src/realtime/**
      - pnpm-lock.yaml

concurrency:
  group: bob-live-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Le config Expo refuse volontairement tout binaire sans API, auth et liens légaux. Les valeurs
# ci-dessous sont des origines réservées au harnais de compilation : elles ne sont ni des données
# produit, ni des secrets, ni un mode démo, et aucun artefact de ce workflow n'est distribué.
env:
  CI: "true"
  EXPO_PUBLIC_API_URL: https://api.ci.bobpro.test
  EXPO_PUBLIC_SUPABASE_URL: https://supabase.ci.bobpro.test
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key-not-a-secret
  EXPO_PUBLIC_TERMS_URL: https://legal.ci.bobpro.test/conditions-utilisation
  EXPO_PUBLIC_PRIVACY_URL: https://legal.ci.bobpro.test/confidentialite
  EXPO_PUBLIC_SUPPORT_EMAIL: support@bobpro.test
  EXPO_PUBLIC_SIGNUP_CONFIRMATION_WEB_URL: https://legal.ci.bobpro.test/auth/confirme

jobs:
  android-contract:
    name: Android module + wire contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck the mobile and native TypeScript boundaries
        run: |
          pnpm --filter @bob/mobile typecheck
          pnpm --dir apps/mobile exec tsc --noEmit -p modules/bob-live-audio/tsconfig.json
      - name: Run the native wire-contract suite
        run: pnpm --dir apps/mobile exec vitest run --config modules/bob-live-audio/vitest.config.ts
      - name: Verify Expo autolinking on both platforms
        run: |
          pnpm --dir apps/mobile exec expo-modules-autolinking verify --platform android
          pnpm --dir apps/mobile exec expo-modules-autolinking verify --platform apple
      - name: Generate the ephemeral Android project
        run: pnpm --filter @bob/mobile exec expo prebuild --platform android --no-install
      - name: Compile the Android bridge and run its deterministic VAD tests
        working-directory: apps/mobile/android
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/bob-live-gradle
        run: ./gradlew :bob-live-audio:testDebugUnitTest --no-daemon --stacktrace

  swift-contract:
    name: Swift bridge + Expo iOS build + VAD contract
    # ExpoModulesJSI 57.0.4 ne compile pas avec le type-checker de Xcode 26.2
    # (`abs(Double)` ambigu). Xcode 26.6 est la version stable qui compile réellement
    # Expo 57 et elle est épinglée par son chemin exact sur l'image macOS 26.
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Verify the pinned stable Xcode toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Parse the Expo Swift bridge
        working-directory: apps/mobile/modules/bob-live-audio
        run: swiftc -parse ios/BobLiveAudioModule.swift
      - name: Certify the capture watchdog fence
        working-directory: apps/mobile/modules/bob-live-audio
        run: |
          swiftc -module-cache-path "${RUNNER_TEMP}/bob-live-watchdog-cache" \
            ios/BobLiveAudioWatchdogFence.swift tests/swift/main.swift \
            -o "${RUNNER_TEMP}/bob-live-watchdog-tests"
          "${RUNNER_TEMP}/bob-live-watchdog-tests"
      - name: Certify the out-of-band cancellation fence
        working-directory: apps/mobile/modules/bob-live-audio
        run: |
          swiftc -module-cache-path "${RUNNER_TEMP}/bob-live-cancellation-cache" \
            ios/BobLiveAudioCancellationFence.swift tests/swift/cancellation-main.swift \
            -o "${RUNNER_TEMP}/bob-live-cancellation-tests"
          "${RUNNER_TEMP}/bob-live-cancellation-tests"
      - name: Run the deterministic Swift VAD contract
        working-directory: apps/mobile/modules/bob-live-audio
        run: |
          swiftc -module-cache-path "${RUNNER_TEMP}/bob-live-vad-cache" \
            ios/BobLiveVad.swift tests/swift/vad-main.swift \
            -o "${RUNNER_TEMP}/bob-live-vad-tests"
          "${RUNNER_TEMP}/bob-live-vad-tests"
      - name: Generate the ephemeral iOS project
        run: pnpm --filter @bob/mobile exec expo prebuild --platform ios --no-install
      - name: Resolve the generated CocoaPods workspace
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile the real Expo iOS application and BobLiveAudio pod
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace BobPro.xcworkspace \
            -scheme BobPro \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/bob-live-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
