name: Bob Live Native Contracts

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/bob-live-native.yml
      - apps/mobile/app.json
      - apps/mobile/package.json
      - apps/mobile/modules/bob-live-audio/**
      - apps/mobile/src/agent/**
      - apps/mobile/src/audio/**
      - apps/mobile/src/realtime/**
      - packages/ai/src/realtime/**
      - pnpm-lock.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/bob-live-native.yml
      - apps/mobile/app.json
      - apps/mobile/package.json
      - apps/mobile/modules/bob-live-audio/**
      - apps/mobile/src/agent/**
      - apps/mobile/src/audio/**
      - apps/mobile/src/realtime/**
      - packages/ai/src/realtime/**
      - pnpm-lock.yaml

# Dédoublonnage (audit CI 2026-07-28) : les runs PR d'une même ref s'annulent quand un commit
# les rend caducs — comportement historique conservé, c'est lui qui borne le coût macOS des
# rafales de branche. Les runs de main et les dispatch reçoivent un groupe unique par run
# (run_id) : deux merges rapprochés ne s'annulent jamais entre eux, chaque merge sur main
# garde sa preuve native complète (main est la vérité de référence des caches ci-dessous).
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('bob-live-native-pr-{0}', github.ref)
    || format('bob-live-native-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Le config Expo refuse volontairement tout binaire sans API, auth et liens légaux. Les valeurs
# ci-dessous sont des origines réservées au harnais de compilation : elles ne sont ni des données
# produit, ni des secrets, ni un mode démo, et aucun artefact de ce workflow n'est distribué.
env:
  CI: "true"
  EXPO_PUBLIC_API_URL: https://api.ci.bobpro.test
  EXPO_PUBLIC_SUPABASE_URL: https://supabase.ci.bobpro.test
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key-not-a-secret
  EXPO_PUBLIC_TERMS_URL: https://legal.ci.bobpro.test/conditions-utilisation
  EXPO_PUBLIC_PRIVACY_URL: https://legal.ci.bobpro.test/confidentialite
  EXPO_PUBLIC_SUPPORT_EMAIL: support@bobpro.test
  EXPO_PUBLIC_SIGNUP_CONFIRMATION_WEB_URL: https://legal.ci.bobpro.test/auth/confirme

jobs:
  android-contract:
    name: Android module + wire contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck the mobile and native TypeScript boundaries
        run: |
          pnpm --filter @bob/mobile typecheck
          pnpm --dir apps/mobile exec tsc --noEmit -p modules/bob-live-audio/tsconfig.json
      - name: Run the native wire-contract suite
        run: pnpm --dir apps/mobile exec vitest run --config modules/bob-live-audio/vitest.config.ts
      - name: Verify Expo autolinking on both platforms
        run: |
          pnpm --dir apps/mobile exec expo-modules-autolinking verify --platform android
          pnpm --dir apps/mobile exec expo-modules-autolinking verify --platform apple
      - name: Generate the ephemeral Android project
        run: pnpm --filter @bob/mobile exec expo prebuild --platform android --no-install
      # Cache d'ENTRÉES uniquement (audit CI 2026-07-28 : distribution Gradle + dépendances
      # retéléchargées à froid ≈ 2-3 min sur les 4,1 min du step). GRADLE_USER_HOME reste un
      # répertoire dédié hors du dépôt et `--no-daemon` est conservé : on ne met en cache que
      # `caches/` et `wrapper/`, jamais une sortie de build. Gradle revalide chaque dépendance
      # par empreinte : un cache partiel ou périmé est complété, jamais cru sur parole — les
      # tests VAD restent strictement déterministes. Le step est placé APRÈS le prebuild pour
      # que la clé hache le wrapper Gradle réellement généré par Expo.
      - name: Mettre en cache les dépendances Gradle (wrapper + dépôts)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/bob-live-gradle/caches
            ${{ runner.temp }}/bob-live-gradle/wrapper
          key: bob-live-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml', 'apps/mobile/app.json', 'apps/mobile/package.json', 'apps/mobile/modules/bob-live-audio/android/build.gradle') }}
          # Préfixe partiel sûr pour un cache de dépendances : Gradle télécharge ce qui manque
          # et ignore ce qui ne correspond plus, il ne peut pas produire de faux vert.
          restore-keys: |
            bob-live-gradle-${{ runner.os }}-
      - name: Compile the Android bridge and run its deterministic VAD tests
        working-directory: apps/mobile/android
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/bob-live-gradle
        run: ./gradlew :bob-live-audio:testDebugUnitTest --no-daemon --stacktrace

  swift-contract:
    name: Swift bridge + Expo iOS build + VAD contract
    # ExpoModulesJSI 57.0.4 ne compile pas avec le type-checker de Xcode 26.2
    # (`abs(Double)` ambigu). Xcode 26.6 est la version stable qui compile réellement
    # Expo 57 et elle est épinglée par son chemin exact sur l'image macOS 26.
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Déclinaison « clé de cache » du pin ci-dessus (contrainte documentée : toute clé
      # DerivedData doit inclure la version Xcode épinglée). Monter de Xcode = changer les
      # DEUX valeurs ; le garde apps/api/scripts/ci-cost-guardrails.test.mjs vérifie qu'elles
      # restent alignées, et le changement invalide mécaniquement le cache DerivedData.
      XCODE_CACHE_PIN: xcode-26.6
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Verify the pinned stable Xcode toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Parse the Expo Swift bridge
        working-directory: apps/mobile/modules/bob-live-audio
        run: swiftc -parse ios/BobLiveAudioModule.swift
      - name: Certify the capture watchdog fence
        working-directory: apps/mobile/modules/bob-live-audio
        run: |
          swiftc -module-cache-path "${RUNNER_TEMP}/bob-live-watchdog-cache" \
            ios/BobLiveAudioWatchdogFence.swift tests/swift/main.swift \
            -o "${RUNNER_TEMP}/bob-live-watchdog-tests"
          "${RUNNER_TEMP}/bob-live-watchdog-tests"
      - name: Certify the out-of-band cancellation fence
        working-directory: apps/mobile/modules/bob-live-audio
        run: |
          swiftc -module-cache-path "${RUNNER_TEMP}/bob-live-cancellation-cache" \
            ios/BobLiveAudioCancellationFence.swift tests/swift/cancellation-main.swift \
            -o "${RUNNER_TEMP}/bob-live-cancellation-tests"
          "${RUNNER_TEMP}/bob-live-cancellation-tests"
      - name: Run the deterministic Swift VAD contract
        working-directory: apps/mobile/modules/bob-live-audio
        run: |
          swiftc -module-cache-path "${RUNNER_TEMP}/bob-live-vad-cache" \
            ios/BobLiveVad.swift tests/swift/vad-main.swift \
            -o "${RUNNER_TEMP}/bob-live-vad-tests"
          "${RUNNER_TEMP}/bob-live-vad-tests"
      - name: Generate the ephemeral iOS project
        run: pnpm --filter @bob/mobile exec expo prebuild --platform ios --no-install
      # Cache d'ENTRÉES CocoaPods (audit CI 2026-07-28 : pod install à froid p50 1,2 min) :
      # le cache de téléchargement (~/Library/Caches/CocoaPods) et les sources de pods déjà
      # résolues (ios/Pods). `pod install` revalide toujours Podfile/Manifest : un contenu
      # partiel ou périmé est réinstallé, jamais accepté tel quel — pas de faux vert possible.
      # Le step est placé APRÈS le prebuild pour que la clé hache le Podfile réellement généré.
      - name: Mettre en cache CocoaPods (téléchargements + Pods résolus)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: bob-live-pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile', 'pnpm-lock.yaml', 'apps/mobile/app.json') }}
          restore-keys: |
            bob-live-pods-${{ runner.os }}-
      - name: Resolve the generated CocoaPods workspace
        working-directory: apps/mobile/ios
        run: pod install
      # DerivedData — LE poste dominant du parc CI (audit 2026-07-28 : xcodebuild à froid p50
      # 16,5 min, ~86 % du coût pondéré au multiplicateur macOS). Discipline anti-faux-vert :
      #   1. restauration UNIQUEMENT en pull_request et UNIQUEMENT sur clé EXACTE (aucune
      #      restore-key partielle) — un build incrémental n'est accepté que si le Xcode épinglé,
      #      le Podfile.lock généré, pnpm-lock.yaml et app.json sont identiques ; au moindre
      #      écart, build à froid complet ;
      #   2. les runs de main (push/dispatch) ne restaurent JAMAIS : chaque merge garde son
      #      build à froid comme vérité de référence, et c'est lui qui sème le cache exact que
      #      les PR consomment ; en cas de doute sur un vert de PR, le run de main tranche.
      - name: Restaurer DerivedData (PR uniquement, clé exacte)
        id: deriveddata_restore
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bob-live-derived-data
          key: bob-live-deriveddata-${{ env.XCODE_CACHE_PIN }}-${{ hashFiles('apps/mobile/ios/Podfile.lock', 'pnpm-lock.yaml', 'apps/mobile/app.json') }}
      - name: Compile the real Expo iOS application and BobLiveAudio pod
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace BobPro.xcworkspace \
            -scheme BobPro \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/bob-live-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
      # Sauvegarde du DerivedData seulement après un xcodebuild VERT (un step sans `always()`
      # ne tourne pas si un step précédent a échoué : aucun état partiel d'un build rouge ne
      # peut être semé), et seulement si la clé exacte n'était pas déjà servie. Sur main, le
      # restore est sauté donc `cache-hit` est vide : c'est bien main qui sème la référence.
      - name: Sauvegarder DerivedData après un build vert
        if: steps.deriveddata_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bob-live-derived-data
          key: bob-live-deriveddata-${{ env.XCODE_CACHE_PIN }}-${{ hashFiles('apps/mobile/ios/Podfile.lock', 'pnpm-lock.yaml', 'apps/mobile/app.json') }}
