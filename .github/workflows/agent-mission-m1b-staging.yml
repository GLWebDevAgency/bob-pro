name: AgentMission M1-B Staging Certification

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Staging operation to execute
        required: true
        default: certification
        type: choice
        options:
          - certification
          - recovery
      founder_authorization_date:
        description: Founder authorization date (YYYY-MM-DD)
        required: true
        type: string
      founder_authorization_channel:
        description: Channel containing the founder authorization
        required: true
        type: string
      founder_authorization_ref:
        description: Immutable founder authorization reference
        required: true
        type: string
      claude_countersign_ref:
        description: Immutable Claude countersignature reference
        required: true
        type: string
      gpt_countersign_ref:
        description: Immutable GPT countersignature reference
        required: true
        type: string
  workflow_call:
    inputs:
      mode:
        description: Staging operation to execute
        required: false
        default: certification
        type: string
      founder_authorization_date:
        description: Founder authorization date (YYYY-MM-DD)
        required: true
        type: string
      founder_authorization_channel:
        description: Channel containing the founder authorization
        required: true
        type: string
      founder_authorization_ref:
        description: Immutable founder authorization reference
        required: true
        type: string
      claude_countersign_ref:
        description: Immutable Claude countersignature reference
        required: true
        type: string
      gpt_countersign_ref:
        description: Immutable GPT countersignature reference
        required: true
        type: string

concurrency:
  group: railway-api-staging
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: staging
    outputs:
      release_sha: ${{ steps.initialize.outputs.release_sha }}
      started_at: ${{ steps.initialize.outputs.started_at }}
      baseline_deployment_id: ${{ steps.deploy_baseline.outputs.deployment_id }}
      baseline_deployment_acknowledged: ${{ steps.deploy_baseline.outputs.deployment_acknowledged }}
      active_deployment_id: ${{ steps.deploy_active.outputs.deployment_id }}
      whisper_deployment_id: ${{ steps.deploy_whisper.outputs.deployment_id }}
      acoustic_readiness_ms: ${{ steps.active_readiness.outputs.acoustic_readiness_ms }}
      variables_owned: ${{ steps.activate_variables.outputs.owned }}
      override_owned: ${{ steps.enable_override.outputs.owned }}
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WHISPER_AUDIT_SERVICE_ID: ${{ vars.RAILWAY_WHISPER_AUDIT_SERVICE_ID }}
      BOB_M1B_RELEASE_SHA: ${{ github.sha }}
      BOB_M1B_STAGING_USER_ID: ${{ vars.BOB_M1B_STAGING_USER_ID }}
      BOB_M1B_STAGING_COMPANY_ID: ${{ vars.BOB_M1B_STAGING_COMPANY_ID }}
      BOB_M1B_STAGING_HMAC_KEY_VERSION: ${{ vars.BOB_M1B_STAGING_HMAC_KEY_VERSION }}
      BOB_M1B_STAGING_RUN_ID: ${{ github.run_id }}
      BOB_M1B_STAGING_SUPABASE_PROJECT_REF: ${{ vars.BOB_M1B_STAGING_SUPABASE_PROJECT_REF }}
      BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER: ${{ vars.BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER }}
      BOB_M1B_STAGING_DATABASE_OID: ${{ vars.BOB_M1B_STAGING_DATABASE_OID }}
      BOB_M1B_STAGING_DATABASE_NAME: ${{ vars.BOB_M1B_STAGING_DATABASE_NAME }}
      BOB_M1B_STAGING_FOUNDER_AUTH_DATE: ${{ inputs.founder_authorization_date }}
      BOB_M1B_STAGING_FOUNDER_AUTH_CHANNEL: ${{ inputs.founder_authorization_channel }}
      BOB_M1B_STAGING_FOUNDER_AUTH_REF: ${{ inputs.founder_authorization_ref }}
      BOB_M1B_STAGING_CLAUDE_COUNTERSIGN_REF: ${{ inputs.claude_countersign_ref }}
      BOB_M1B_STAGING_GPT_COUNTERSIGN_REF: ${{ inputs.gpt_countersign_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize exact-SHA evidence and validate bounded inputs
        id: initialize
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
          BOB_M1B_WORKFLOW_MODE: ${{ inputs.mode }}
        run: |
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const sha = /^[0-9a-f]{40}$/;
          const required = [
            'API_BASE_URL',
            'RAILWAY_PROJECT_ID',
            'RAILWAY_ENVIRONMENT_ID',
            'RAILWAY_API_SERVICE_ID',
            'RAILWAY_WHISPER_AUDIT_SERVICE_ID',
            'BOB_M1B_STAGING_USER_ID',
            'BOB_M1B_STAGING_COMPANY_ID',
            'BOB_M1B_STAGING_HMAC_KEY_VERSION',
            'BOB_M1B_STAGING_SUPABASE_PROJECT_REF',
            'BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER',
            'BOB_M1B_STAGING_DATABASE_OID',
            'BOB_M1B_STAGING_DATABASE_NAME',
            'BOB_M1B_STAGING_HMAC_KEYRING',
            'BOB_M1B_STAGING_SUPABASE_ANON_KEY',
            'BOB_M1B_STAGING_ACCOUNT_EMAIL',
            'BOB_M1B_STAGING_ACCOUNT_PASSWORD',
            'BOB_M1B_STAGING_FOUNDER_AUTH_DATE',
            'BOB_M1B_STAGING_FOUNDER_AUTH_CHANNEL',
            'BOB_M1B_STAGING_FOUNDER_AUTH_REF',
            'BOB_M1B_STAGING_CLAUDE_COUNTERSIGN_REF',
            'BOB_M1B_STAGING_GPT_COUNTERSIGN_REF',
            'RAILWAY_TOKEN',
          ];
          for (const name of required) {
            const value = process.env[name];
            if (typeof value !== 'string' || value.length < 1 || value.length > 16_384) {
              throw new Error(`${name} is required by the staging environment`);
            }
          }
          if (!sha.test(process.env.GITHUB_SHA ?? '')) throw new Error('GITHUB_SHA must be exact');
          if (!['certification', 'recovery'].includes(process.env.BOB_M1B_WORKFLOW_MODE ?? '')) {
            throw new Error('BOB_M1B_WORKFLOW_MODE must be certification or recovery');
          }
          for (const name of [
            'RAILWAY_PROJECT_ID',
            'RAILWAY_ENVIRONMENT_ID',
            'RAILWAY_API_SERVICE_ID',
            'RAILWAY_WHISPER_AUDIT_SERVICE_ID',
            'BOB_M1B_STAGING_USER_ID',
          ]) {
            if (!uuid.test(process.env[name] ?? '')) throw new Error(`${name} must be a UUID`);
          }
          if (
            !/^[A-Za-z0-9][A-Za-z0-9-]{0,63}$/.test(
              process.env.BOB_M1B_STAGING_COMPANY_ID ?? '',
            )
          ) {
            throw new Error('BOB_M1B_STAGING_COMPANY_ID must be canonical');
          }
          const api = new URL(process.env.API_BASE_URL);
          if (api.protocol !== 'https:' || api.origin !== process.env.API_BASE_URL) {
            throw new Error('API_BASE_URL must be an exact HTTPS origin');
          }
          NODE
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Fail fast on an ineligible staging account
        env:
          SUPABASE_URL: "https://${{ vars.BOB_M1B_STAGING_SUPABASE_PROJECT_REF }}.supabase.co"
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
        run: node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs preflight
      - name: Install deterministic release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pnpm install --frozen-lockfile
          pnpm --filter @bob/web exec playwright install --with-deps chromium
          sh apps/api/scripts/install-railway-cli.sh
      - name: Build the exact runtime and certify dedicated operators
        run: |
          pnpm --filter "@bob/api..." build
          pnpm --filter "@bob/api-client..." build
          node --test \
            apps/api/scripts/psql-child-environment.test.mjs \
            apps/api/scripts/agent-mission-m1b-staging-*.test.mjs
          node apps/api/scripts/write-release-metadata.mjs "$GITHUB_SHA" staging
      - name: Preflight Railway variables and strict flag baseline
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs preflight
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-flag.mjs bootstrap-preflight
      - name: Preflight and deploy the private Whisper auditor at the exact SHA
        id: deploy_whisper
        if: ${{ inputs.mode == 'certification' }}
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          node apps/api/scripts/agent-mission-m1b-staging-whisper.mjs preflight
          deployment_id="$(
            railway up --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_WHISPER_AUDIT_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --detach --json \
              | node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deployment-id
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          node apps/api/scripts/agent-mission-m1b-staging-whisper.mjs \
            wait-deployment "$deployment_id"
          node apps/api/scripts/agent-mission-m1b-staging-whisper.mjs preflight
      - name: Baseline OFF predeploy
        if: ${{ inputs.mode == 'certification' }}
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env RELEASE_ENVIRONMENT=staging \
              sh apps/api/scripts/check-release-env.sh
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs predeploy
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-flag.mjs preflight
      - name: Deploy exact SHA with M1-B OFF
        id: deploy_baseline
        if: ${{ inputs.mode == 'certification' }}
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          deployment_id="$(
            railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --detach --json \
              | node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deployment-id
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
            wait-deployment "$deployment_id"
          echo "deployment_acknowledged=true" >> "$GITHUB_OUTPUT"
      - name: Prove baseline topology, readiness and postdeploy
        if: ${{ inputs.mode == 'certification' }}
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          topology=false
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json \
              | node apps/api/scripts/certify-railway-single-replica.mjs \
                staging "$RAILWAY_API_SERVICE_ID"
            then
              topology=true
              break
            fi
            sleep 5
          done
          test "$topology" = true
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs postdeploy
      - name: Prove real WebRTC negotiation remains OFF
        if: ${{ inputs.mode == 'certification' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          # Re-certifie la readiness au SHA exact JUSTE avant le smoke : le cache acoustique
          # (TTL 15 min) est chauffé après le postdeploy long, le smoke ne part jamais cache froid.
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs negative
      - name: Prove stable HMAC keyspace cannot rotate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-key-state.mjs preflight
      - name: Activate only the complete M1-B variable block
        id: activate_variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs activate
          echo "owned=true" >> "$GITHUB_OUTPUT"
      - name: Active M1-B predeploy
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env RELEASE_ENVIRONMENT=staging \
              sh apps/api/scripts/check-release-env.sh
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs predeploy
      - name: Deploy exact SHA with M1-B configured
        id: deploy_active
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          deployment_id="$(
            railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --detach --json \
              | node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deployment-id
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
            wait-deployment "$deployment_id"
      - name: Prove active topology, readiness, postdeploy and writer floor
        id: active_readiness
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          topology=false
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json \
              | node apps/api/scripts/certify-railway-single-replica.mjs \
                staging "$RAILWAY_API_SERVICE_ID"
            then
              topology=true
              break
            fi
            sleep 5
          done
          test "$topology" = true
          readiness_started_ms="$(date +%s%3N)"
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          readiness_finished_ms="$(date +%s%3N)"
          acoustic_readiness_ms="$((readiness_finished_ms - readiness_started_ms))"
          test "$acoustic_readiness_ms" -ge 1
          test "$acoustic_readiness_ms" -le 600000
          echo "acoustic_readiness_ms=$acoustic_readiness_ms" >> "$GITHUB_OUTPUT"
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs postdeploy
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-active
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-key-state.mjs active
      - name: Enable only the authorized user override
        id: enable_override
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-flag.mjs enable
          echo "owned=true" >> "$GITHUB_OUTPUT"
      - name: Recover only the exact technical staging residue
        if: ${{ inputs.mode == 'recovery' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs recovery
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-flag.mjs assert-active
      - name: Execute real positive WebRTC mission and runtime RLS proof
        if: ${{ inputs.mode == 'certification' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          # Re-certifie la readiness au SHA exact JUSTE avant le smoke : le cache acoustique
          # (TTL 15 min) est chauffé après le postdeploy long, le smoke ne part jamais cache froid.
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs positive
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-flag.mjs assert-active

  cleanup:
    needs: certify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: staging
    outputs:
      off_deployment_id: ${{ steps.deploy_off.outputs.deployment_id || 'not-created' }}
      variables_removed: ${{ steps.remove_variables.outputs.removed || 'false' }}
      override_removed: ${{ steps.remove_override.outputs.removed || 'false' }}
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      BOB_M1B_RELEASE_SHA: ${{ github.sha }}
      BOB_M1B_STAGING_USER_ID: ${{ vars.BOB_M1B_STAGING_USER_ID }}
      BOB_M1B_STAGING_COMPANY_ID: ${{ vars.BOB_M1B_STAGING_COMPANY_ID }}
      BOB_M1B_STAGING_HMAC_KEY_VERSION: ${{ vars.BOB_M1B_STAGING_HMAC_KEY_VERSION }}
      BOB_M1B_STAGING_RUN_ID: ${{ github.run_id }}
      BOB_M1B_STAGING_SUPABASE_PROJECT_REF: ${{ vars.BOB_M1B_STAGING_SUPABASE_PROJECT_REF }}
      BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER: ${{ vars.BOB_M1B_STAGING_DATABASE_SYSTEM_IDENTIFIER }}
      BOB_M1B_STAGING_DATABASE_OID: ${{ vars.BOB_M1B_STAGING_DATABASE_OID }}
      BOB_M1B_STAGING_DATABASE_NAME: ${{ vars.BOB_M1B_STAGING_DATABASE_NAME }}
      BOB_M1B_STAGING_FOUNDER_AUTH_DATE: ${{ inputs.founder_authorization_date }}
      BOB_M1B_STAGING_FOUNDER_AUTH_CHANNEL: ${{ inputs.founder_authorization_channel }}
      BOB_M1B_STAGING_FOUNDER_AUTH_REF: ${{ inputs.founder_authorization_ref }}
      BOB_M1B_STAGING_CLAUDE_COUNTERSIGN_REF: ${{ inputs.claude_countersign_ref }}
      BOB_M1B_STAGING_GPT_COUNTERSIGN_REF: ${{ inputs.gpt_countersign_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Prepare independent cleanup runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pnpm install --frozen-lockfile
          pnpm --filter @bob/web exec playwright install --with-deps chromium
          sh apps/api/scripts/install-railway-cli.sh
          pnpm --filter "@bob/api..." build
          pnpm --filter "@bob/api-client..." build
          node apps/api/scripts/write-release-metadata.mjs "$GITHUB_SHA" staging
      - name: Pin exact staging database before cleanup mutations
        id: pin_database
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
      - name: Recover the exact technical residue before disabling M1-B
        id: recover_account
        if: ${{ always() && steps.pin_database.outcome == 'success' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
        run: |
          recovery_state="$(
            railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
              node --input-type=module -e \
                "import { certifyM1BRecoveryStateEvidence as certify } from './apps/api/scripts/agent-mission-m1b-staging-evidence.mjs'; process.stdout.write(certify(process.env).state)"
          )"
          case "$(printf '%s\n' "$recovery_state" | tail -n 1)" in
            clean) ;;
            recoverable)
              node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
              railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
                --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
                node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs recovery
              ;;
            *) echo "Unexpected bounded recovery state" >&2; exit 1 ;;
          esac
      - name: Remove only the user override durably owned by this run
        id: remove_override
        if: ${{ always() && steps.pin_database.outcome == 'success' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          result="$(
            railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
              node apps/api/scripts/agent-mission-m1b-staging-flag.mjs cleanup
          )"
          printf '%s\n' "$result"
          case "$(printf '%s\n' "$result" | tail -n 1)" in
            *:changed) echo "removed=true" >> "$GITHUB_OUTPUT" ;;
            *:unchanged) echo "removed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected flag cleanup receipt" >&2; exit 1 ;;
          esac
      - name: Remove only the Railway block durably owned by this run
        id: remove_variables
        if: ${{ always() }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
          BOB_M1B_VARIABLES_WERE_OWNED: ${{ needs.certify.outputs.variables_owned || 'false' }}
        run: |
          result="$(
            node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deactivate
          )"
          printf '%s\n' "$result"
          case "$(printf '%s\n' "$result" | tail -n 1)" in
            *:changed) echo "removed=true" >> "$GITHUB_OUTPUT" ;;
            *:unchanged)
              case "$BOB_M1B_VARIABLES_WERE_OWNED" in
                true) echo "removed=true" >> "$GITHUB_OUTPUT" ;;
                false) echo "removed=false" >> "$GITHUB_OUTPUT" ;;
                *) echo "Invalid durable ownership receipt" >&2; exit 1 ;;
              esac
              ;;
            *) echo "Unexpected Railway cleanup receipt" >&2; exit 1 ;;
          esac
      - name: OFF predeploy after owned configuration removal
        id: off_predeploy
        if: ${{ always() && steps.pin_database.outcome == 'success' && steps.remove_override.outcome == 'success' && steps.remove_variables.outputs.removed == 'true' }}
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env RELEASE_ENVIRONMENT=staging \
              sh apps/api/scripts/check-release-env.sh
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs predeploy
      - name: Deploy exact SHA with M1-B OFF again
        id: deploy_off
        if: ${{ always() && steps.remove_variables.outputs.removed == 'true' }}
        timeout-minutes: 60
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          deployment_id="$(
            railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --detach --json \
              | node apps/api/scripts/agent-mission-m1b-staging-railway.mjs deployment-id
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs \
            wait-deployment "$deployment_id"
      - name: Prove emergency OFF topology and readiness
        if: ${{ always() && steps.deploy_off.outcome == 'success' }}
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          topology=false
          for attempt in $(seq 1 12); do
            if timeout 20s railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json \
              | node apps/api/scripts/certify-railway-single-replica.mjs \
                staging "$RAILWAY_API_SERVICE_ID"
            then
              topology=true
              break
            fi
            sleep 5
          done
          test "$topology" = true
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-off
      - name: Complete OFF postdeploy and writer fence
        if: ${{ always() && steps.off_predeploy.outcome == 'success' && steps.deploy_off.outcome == 'success' }}
        timeout-minutes: 120
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs postdeploy
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-key-state.mjs off
      - name: Prove untouched keyspace when activation never became owned
        if: ${{ always() && steps.pin_database.outcome == 'success' && steps.remove_override.outcome == 'success' && steps.remove_variables.outcome == 'success' && steps.remove_variables.outputs.removed != 'true' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-key-state.mjs bootstrap
      - name: Restore global Bob Live capacity independently after cleanup attempts
        id: restore_capacity
        if: ${{ always() && steps.pin_database.outcome == 'success' && steps.remove_override.outcome == 'success' && steps.remove_variables.outcome == 'success' }}
        timeout-minutes: 20
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            env CABINET_RELEASE_ENV=staging \
              node apps/api/scripts/agent-mission-m1b-staging-release.mjs restore-capacity
      - name: Final independent OFF data cleanliness proof
        id: final_off_data
        if: ${{ always() && steps.pin_database.outcome == 'success' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_HMAC_KEYRING: ${{ secrets.BOB_M1B_STAGING_HMAC_KEYRING }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-database.mjs
          node apps/api/scripts/agent-mission-m1b-staging-railway.mjs assert-off
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-flag.mjs bootstrap-preflight
      - name: Final independent OFF negotiation proof when M1-B binary was deployed
        if: ${{ always() && steps.final_off_data.outcome == 'success' && (needs.certify.outputs.baseline_deployment_acknowledged == 'true' || needs.certify.outputs.variables_owned == 'true') }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOB_M1B_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BOB_M1B_STAGING_SUPABASE_ANON_KEY }}
          BOB_M1B_STAGING_ACCOUNT_EMAIL: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_EMAIL }}
          BOB_M1B_STAGING_ACCOUNT_PASSWORD: ${{ secrets.BOB_M1B_STAGING_ACCOUNT_PASSWORD }}
        run: |
          # Re-certifie la readiness au SHA exact JUSTE avant le smoke : le postdeploy OFF
          # (~18 min mesurés) dépasse le TTL acoustique 15 min, le smoke ne part jamais cache froid.
          node apps/api/scripts/agent-mission-m1b-staging-readiness.mjs
          railway run --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_API_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --no-local -- \
            node apps/api/scripts/agent-mission-m1b-staging-smoke.mjs negative

  evidence:
    needs:
      - certify
      - cleanup
    if: ${{ always() && inputs.mode == 'certification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Write bounded non-PII certification report
        env:
          BOB_M1B_RELEASE_SHA: ${{ github.sha }}
          BOB_M1B_WORKFLOW_RUN_ID: ${{ github.run_id }}
          BOB_M1B_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          BOB_M1B_STARTED_AT: ${{ needs.certify.outputs.started_at }}
          BOB_M1B_BASELINE_DEPLOYMENT_ID: ${{ needs.certify.outputs.baseline_deployment_id || 'not-created' }}
          BOB_M1B_BASELINE_DEPLOYMENT_ACKNOWLEDGED: ${{ needs.certify.outputs.baseline_deployment_acknowledged || 'false' }}
          BOB_M1B_ACTIVE_DEPLOYMENT_ID: ${{ needs.certify.outputs.active_deployment_id || 'not-created' }}
          BOB_M1B_WHISPER_DEPLOYMENT_ID: ${{ needs.certify.outputs.whisper_deployment_id || 'not-created' }}
          BOB_M1B_ACOUSTIC_READINESS_MS: ${{ needs.certify.outputs.acoustic_readiness_ms || 'not-measured' }}
          BOB_M1B_OFF_DEPLOYMENT_ID: ${{ needs.cleanup.outputs.off_deployment_id || 'not-created' }}
          BOB_M1B_CERTIFY_RESULT: ${{ needs.certify.result }}
          BOB_M1B_CLEANUP_RESULT: ${{ needs.cleanup.result }}
          BOB_M1B_VARIABLES_OWNED: ${{ needs.certify.outputs.variables_owned || 'false' }}
          BOB_M1B_OVERRIDE_OWNED: ${{ needs.certify.outputs.override_owned || 'false' }}
          BOB_M1B_VARIABLES_REMOVED: ${{ needs.cleanup.outputs.variables_removed || 'false' }}
          BOB_M1B_OVERRIDE_REMOVED: ${{ needs.cleanup.outputs.override_removed || 'false' }}
        run: |
          finished_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          BOB_M1B_FINISHED_AT="$finished_at" \
            node apps/api/scripts/agent-mission-m1b-staging-report.mjs \
              ".release-evidence/agent-mission-m1b/${GITHUB_SHA}.json"
      - name: Preserve bounded staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-mission-m1b-staging-${{ github.sha }}
          path: .release-evidence/agent-mission-m1b/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Require the measured staging budget after preserving evidence
        run: |
          node apps/api/scripts/agent-mission-m1b-staging-report.mjs \
            verify-performance \
            ".release-evidence/agent-mission-m1b/${GITHUB_SHA}.json"

  verdict:
    needs:
      - certify
      - cleanup
      - evidence
    if: ${{ always() && inputs.mode == 'certification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require positive certification and independent OFF cleanup
        env:
          CERTIFY_RESULT: ${{ needs.certify.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
        run: |
          test "$CERTIFY_RESULT" = success
          test "$CLEANUP_RESULT" = success
          test "$EVIDENCE_RESULT" = success

  recovery-verdict:
    needs:
      - certify
      - cleanup
    if: ${{ always() && inputs.mode == 'recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require bounded recovery and independent OFF cleanup
        env:
          RECOVERY_RESULT: ${{ needs.certify.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        run: |
          test "$RECOVERY_RESULT" = success
          test "$CLEANUP_RESULT" = success
