name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/bobpro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bob/core test:cabinet:coverage
      - run: pnpm build
      - run: pnpm lint

  rls-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bobpro
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bobpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bob_app:bob_app@localhost:5432/bobpro
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bobpro
      APP_DATABASE_ROLE: bob_app
      CABINET_RELEASE_ENV: development
      CABINET_INVITATION_WORKER_ENABLED: "false"
      RUN_RLS_CERT: "true"
      RLS_CERT_CLEANUP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Create non-superuser app role
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bob_app') THEN
              CREATE ROLE bob_app LOGIN PASSWORD 'bob_app' NOSUPERUSER NOBYPASSRLS;
            ELSE
              ALTER ROLE bob_app WITH LOGIN PASSWORD 'bob_app' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END $$;
          SQL
      - name: Expand schema, spool outbox and certify the mixed-version phase
        run: sh apps/api/scripts/release.sh
      - name: Activate outbox v2 and certify the post-deploy contract
        run: |
          sh apps/api/scripts/activate-notification-outbox-v2.sh
          sh apps/api/scripts/release.sh
      - name: Certify notification outbox concurrency and fencing on PostgreSQL
        env:
          RUN_POSTGRES_OUTBOX_CERT: "true"
        run: pnpm --filter @bob/api exec vitest run src/persistence/prisma/notification-jobs.postgres.test.ts
      - name: Certify expense creation idempotency on PostgreSQL
        env:
          RUN_POSTGRES_EXPENSE_IDEMPOTENCY_CERT: "true"
        run: pnpm --filter @bob/api exec vitest run src/persistence/prisma/expense-creation-requests.postgres.test.ts
      - name: Certify quote creation idempotency on PostgreSQL
        env:
          RUN_POSTGRES_QUOTE_IDEMPOTENCY_CERT: "true"
        run: pnpm --filter @bob/api exec vitest run src/persistence/prisma/quote-creation-requests.postgres.test.ts
      - name: Certify global push-token rebind and revocation under FORCE RLS
        env:
          RUN_POSTGRES_DEVICE_REBIND_CERT: "true"
        run: pnpm --filter @bob/api exec vitest run src/persistence/prisma/devices.postgres.test.ts

  facturx-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/bobpro
      # Validateur Factur-X officiel (Schematron EN 16931 + PDF/A via veraPDF embarqué).
      # Mettre à jour vers la dernière version publiée sur Maven Central si besoin.
      MUSTANG_VERSION: "2.16.1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bob/core build
      - run: pnpm --filter @bob/api build
      - name: Générer un échantillon Factur-X (PDF hybride + XML CII)
        run: node apps/api/scripts/generate-facturx-sample.mjs facturx-sample
      - name: Télécharger le validateur Mustang
        run: curl -fsSL --retry 3 --retry-delay 5 -o mustang-cli.jar "https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/${MUSTANG_VERSION}/Mustang-CLI-${MUSTANG_VERSION}.jar"
      - name: Schematron EN 16931 sur le XML CII (gate bloquant)
        run: java -jar mustang-cli.jar --action validate --source facturx-sample/factur-x.xml --no-notices
      - name: veraPDF PDF/A-3 sur le PDF (informatif — embarquage polices = post-traitement prod)
        continue-on-error: true
        run: java -jar mustang-cli.jar --action validate --source facturx-sample/facture-x.pdf --no-notices
