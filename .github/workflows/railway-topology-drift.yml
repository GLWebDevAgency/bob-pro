name: Railway Topology Drift

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
  schedule:
    # Le throttler public reste process-local jusqu'au passage à un storage partagé atomique.
    - cron: '17 * * * *'

concurrency:
  group: railway-topology-drift
  cancel-in-progress: true

jobs:
  certify-single-replica:
    name: ${{ matrix.environment }} remains single-replica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            railway_environment_id: 3c687d72-d6ff-4242-bb22-7eb38522226b
          - environment: production
            railway_environment_id: 0ca9e425-166a-4cd0-bab2-69cdd33f48b9
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
      - name: Install pinned Railway CLI
        run: sh apps/api/scripts/install-railway-cli.sh
      - name: Verify Railway automation credential integrity
        env:
          EXPECTED_SHA256: ${{ vars.RAILWAY_API_TOKEN_SHA256 }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          [ -n "$EXPECTED_SHA256" ] || { echo "Railway token integrity marker is missing" >&2; exit 1; }
          actual_sha256="$(printf '%s' "$RAILWAY_API_TOKEN" | sha256sum | cut -d ' ' -f 1)"
          [ "$actual_sha256" = "$EXPECTED_SHA256" ] || { echo "Railway token secret does not match its integrity marker" >&2; exit 1; }
      - name: Reject topology drift
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENV: ${{ matrix.environment }}
          RAILWAY_ENVIRONMENT_ID: ${{ matrix.railway_environment_id }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: bob-pro-api
        run: |
          [ -n "$RAILWAY_PROJECT_ID" ] || { echo "Railway project id is missing" >&2; exit 1; }
          railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json \
            | node apps/api/scripts/certify-railway-single-replica.mjs "$RAILWAY_ENV" "$RAILWAY_SERVICE"
      - name: Open an owned incident on drift
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INCIDENT_TITLE: Railway topology drift (${{ matrix.environment }})
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --state open --search "\"$INCIDENT_TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "$INCIDENT_TITLE" \
              --body "Le contrôle mono-process a échoué. Tant que le throttler public reste local au processus, traiter cette alerte avant toute promotion : $RUN_URL"
          else
            gh issue comment "$existing" --body "Le contrôle échoue encore : $RUN_URL"
          fi
